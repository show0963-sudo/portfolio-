<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소방안전관리자 2급 · 학습반</title>
<style>
:root{
  --ink:#161A1F;
  --ink-2:#232A32;
  --ink-3:#333D48;
  --paper:#EFF1EE;
  --card:#FFFFFF;
  --line:#D8DCD6;
  --line-2:#E9ECE8;
  --text:#1B2027;
  --text-dim:#697280;
  --exit:#00A05A;
  --exit-dark:#007A45;
  --alarm:#DD3524;
  --amber:#DE9A28;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --nav-w:272px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--text);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--exit);outline-offset:2px}

/* ---------- 레이아웃 ---------- */
.shell{display:flex;min-height:100dvh}

/* ---------- 좌측 회로표시반 ---------- */
.nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);
  background:var(--ink);color:#C7CEd6;
  position:sticky;top:0;height:100dvh;overflow-y:auto;
  padding:0 0 40px;
  border-right:1px solid #000;
}
.nav-head{
  padding:22px 20px 18px;border-bottom:1px solid var(--ink-3);
  position:sticky;top:0;background:var(--ink);z-index:2;
}
.nav-head .kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  color:var(--text-dim);text-transform:uppercase;margin:0 0 6px;
}
.nav-head h1{font-size:17px;margin:0;color:#fff;letter-spacing:-.01em;font-weight:700}
.nav-head .meter{margin-top:14px}
.meter-bar{height:4px;background:var(--ink-3);border-radius:2px;overflow:hidden}
.meter-fill{height:100%;background:var(--exit);width:0;transition:width .35s ease}
.meter-txt{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:6px;display:flex;justify-content:space-between}

.nav-group{padding:18px 0 4px}
.nav-group > .label{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#5C6675;
  padding:0 20px 8px;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;color:#C7CED6;text-align:left;
  padding:9px 20px;font-size:14.5px;line-height:1.35;
  border-left:3px solid transparent;
}
.nav-item:hover{background:var(--ink-2);color:#fff}
.nav-item.on{background:var(--ink-2);color:#fff;border-left-color:var(--exit)}
.nav-item .no{font-family:var(--mono);font-size:11px;color:#5C6675;flex:0 0 auto}
.nav-item.on .no{color:var(--exit)}
.nav-item .nm{flex:1;min-width:0}
.nav-item .ct{font-family:var(--mono);font-size:11px;color:#5C6675}

/* 신호등 램프 — 이 화면의 시그니처 */
.lamp{
  flex:0 0 auto;width:8px;height:8px;border-radius:50%;
  background:#39424D;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
}
.lamp.g{background:var(--exit);box-shadow:0 0 7px rgba(0,160,90,.85)}
.lamp.a{background:var(--amber);box-shadow:0 0 7px rgba(222,154,40,.8)}
.lamp.r{background:var(--alarm);box-shadow:0 0 7px rgba(221,53,36,.85)}

/* ---------- 본문 ---------- */
.main{flex:1;min-width:0;padding:0 0 80px}
.topbar{
  display:none;position:sticky;top:0;z-index:20;
  background:var(--ink);color:#fff;padding:10px 14px;
  align-items:center;gap:12px;
}
.topbar button{background:none;border:1px solid var(--ink-3);color:#fff;border-radius:6px;padding:6px 10px}
.topbar .t{font-size:14px;font-weight:600}

.wrap{max-width:860px;margin:0 auto;padding:38px 28px 0}
.page-head{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:26px}
.page-head .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--text-dim);margin:0 0 8px}
.page-head h2{margin:0;font-size:27px;letter-spacing:-.02em;line-height:1.25}
.page-head p{margin:10px 0 0;color:var(--text-dim);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{
  font-size:12px;font-family:var(--mono);color:var(--text-dim);
  border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;
}

/* 탭 */
.tabs{display:flex;gap:2px;margin-bottom:24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 14px;font-size:14.5px;color:var(--text-dim);margin-bottom:-1px;
}
.tab.on{color:var(--text);border-bottom-color:var(--ink);font-weight:600}
.tab:hover{color:var(--text)}

/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px;letter-spacing:-.01em}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}

.empty{
  border:1px dashed var(--line);border-radius:10px;background:transparent;
  padding:34px 24px;text-align:center;color:var(--text-dim);
}
.empty strong{display:block;color:var(--text);font-size:15.5px;margin-bottom:6px}
.empty code{font-family:var(--mono);font-size:12.5px;background:var(--line-2);padding:2px 6px;border-radius:4px}

/* 이론 블록 */
.theory h3{
  font-size:16px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:baseline;gap:10px;
}
.theory h3 .n{font-family:var(--mono);font-size:12px;color:var(--exit-dark)}
.theory .body{white-space:pre-wrap;font-size:15px}
.theory .body strong{background:linear-gradient(transparent 60%,rgba(0,160,90,.22) 60%)}

/* 문제 */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.qcard.ok{border-color:var(--exit)}
.qcard.no{border-color:var(--alarm)}
.qhead{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line-2);background:#FAFBFA;flex-wrap:wrap}
.qno{font-family:var(--mono);font-size:12px;color:var(--text-dim)}
.qtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.qtag.law{color:#2B5FBE;border-color:#BFD0EE;background:#EEF3FC}
.qtag.calc{color:#8A5A00;border-color:#EBD9AC;background:#FCF6E8}
.qtag.wrong{color:var(--alarm);border-color:#F1C3BD;background:#FCEFEE}
.qflag{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px;color:var(--text-dim)}
.qflag.on{color:var(--amber);border-color:var(--amber)}
.qbody{padding:18px}
.qtext{font-size:16px;margin:0 0 14px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;font-size:15px;line-height:1.5;color:var(--text);transition:background .12s,border-color .12s;
}
.opt:hover:not(:disabled){background:#F6F8F6;border-color:#B9C0B7}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);color:var(--text-dim);flex:0 0 auto}
.opt.correct{border-color:var(--exit);background:#EDF8F2}
.opt.correct .k{color:var(--exit-dark)}
.opt.picked-wrong{border-color:var(--alarm);background:#FDF0EE}
.opt.picked-wrong .k{color:var(--alarm)}

.exp{margin-top:14px;padding:13px 15px;border-radius:8px;background:#F5F7F5;border-left:3px solid var(--exit);font-size:14.5px}
.exp.no{border-left-color:var(--alarm)}
.exp .lb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-dim);display:block;margin-bottom:5px}

/* 진행/요약 */
.bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:13px 18px;margin-bottom:18px;
}
.bar .stat{font-family:var(--mono);font-size:13px;color:var(--text-dim)}
.bar .stat b{color:var(--text);font-size:15px}
.bar .stat.g b{color:var(--exit-dark)}
.bar .stat.r b{color:var(--alarm)}
.bar .sp{flex:1}
.btn{
  background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:7px;
  padding:8px 15px;font-size:14px;font-weight:500;
}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--card);border-color:var(--text-dim)}
.btn.danger{background:transparent;color:var(--alarm);border-color:#EBC4BF}
.btn.danger:hover{background:#FCEFEE}

.result{
  background:var(--ink);color:#fff;border-radius:10px;padding:26px 24px;margin-bottom:18px;
}
.result .score{font-family:var(--mono);font-size:42px;line-height:1;letter-spacing:-.03em}
.result .score small{font-size:16px;color:#8C96A3}
.result .msg{margin:10px 0 0;color:#C7CED6;font-size:14.5px}
.result .acts{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.result .btn.ghost{color:#fff;border-color:var(--ink-3)}
.result .btn.ghost:hover{background:var(--ink-2)}

/* 데이터 주입 */
textarea{
  width:100%;min-height:230px;font-family:var(--mono);font-size:13px;line-height:1.55;
  border:1px solid var(--line);border-radius:8px;padding:13px;resize:vertical;background:#FBFCFB;color:var(--text);
}
.hint{font-size:13.5px;color:var(--text-dim);margin:0 0 12px}
pre.schema{
  background:var(--ink);color:#C7CED6;border-radius:8px;padding:15px;overflow-x:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:0 0 14px;
}
pre.schema .s{color:#7FD1A6}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.card h3{display:flex;align-items:flex-start;gap:8px}
.card h3 .th-t{flex:1;min-width:0}
.th-tools{display:flex;gap:6px;align-items:center;flex-shrink:0}
.th-btn{background:none;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13px;line-height:1;color:var(--text-dim)}
.th-btn:hover{border-color:var(--ink);color:var(--text)}
.edited-badge{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#8A6D1A;background:#FFF3C4;border:1px solid #EAD98F;border-radius:5px;padding:2px 6px}
.th-editform .th-hin{width:100%;box-sizing:border-box;font-family:inherit;font-weight:700;font-size:16px;padding:9px 12px;border:1.5px solid var(--ink);border-radius:8px;margin-bottom:8px;background:var(--card)}
.th-editform .th-bin{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:13.5px;line-height:1.65;padding:12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);resize:vertical}
.th-hint{font-size:12.5px;color:var(--text-dim);margin:6px 0 0}
.autorow{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.autochip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--text-dim)}
.autochip.on{border-color:var(--ink);color:var(--text);background:#EAF6EC}
.autohint{font-size:12px;color:var(--text-dim)}
@media (max-width:880px){ .autohint{display:none} }
.qdg{margin:4px 0 14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:center}
.qdg svg{width:100%;height:auto}
mark.uhl{background:#B9F6CA;padding:0 1px;border-radius:2px;cursor:pointer;box-shadow:0 1px 0 #7BC98F}
mark.uhl:hover{background:#8EE7A6}
#hlBar{display:none;position:absolute;z-index:60;background:var(--ink);border-radius:9px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#hlBar button{background:none;border:0;color:#fff;font-size:13.5px;padding:6px 12px;white-space:nowrap}
.search-in{width:100%;font-size:16px;padding:13px 16px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);margin-bottom:20px;font-family:inherit}
.sr-group{margin-bottom:26px}
.sr-group>.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase}
.sres{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.sres:hover{border-color:var(--ink)}
.sres .sr-t{display:block;font-weight:600;font-size:15px;line-height:1.45}
.sres .sr-c{display:block;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin:3px 0}
.sres .sr-s{display:block;font-size:13.5px;color:var(--text-dim);line-height:1.5}
mark{background:#FFE9A8;color:inherit;padding:0 1px;border-radius:2px}
.hit{outline:2.5px solid var(--amber);outline-offset:3px}
.memoWrap{margin-top:12px}
.memo-add{background:none;border:1px dashed var(--line);color:var(--text-dim);border-radius:8px;padding:7px 12px;font-size:13px}
.memo-add:hover{border-color:var(--amber);color:var(--text)}
.memo-note{background:#FFF8DC;border:1px solid #EAD98F;border-radius:8px;padding:10px 12px}
.memo-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:#8A6D1A;margin-bottom:4px}
.memo-edit{background:none;border:0;color:#8A6D1A;font-size:12px;text-decoration:underline;padding:2px 4px}
.memo-b{font-size:14px;line-height:1.6;color:#4A3D12;white-space:pre-wrap}
.memo-ta{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;border:1.5px solid var(--amber);border-radius:8px;padding:10px;background:#FFFDF2;resize:vertical}
.memo-acts{display:flex;gap:6px;margin-top:8px}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--alarm)}
#jsWarn{
  background:#B3261E;color:#fff;font-size:14px;line-height:1.55;
  padding:14px 18px;text-align:center;
}
#jsWarn b{display:block;font-size:15px;margin-bottom:4px}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
.scrim.on{display:block}

@media (max-width:880px){
  .topbar{display:flex;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar button{min-height:40px;min-width:44px;font-size:18px}
  .nav{
    position:fixed;left:0;top:0;z-index:30;
    width:min(300px,85vw);flex-basis:auto;
    height:100vh;height:100dvh;
    transform:translateX(-100%);transition:transform .22s ease;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    box-shadow:4px 0 24px rgba(0,0,0,.35);
  }
  .nav.on{transform:translateX(0)}
  .nav-item{min-height:46px;padding-top:11px;padding-bottom:11px;font-size:15px}
  .wrap{padding:20px 16px 0}
  .page-head h2{font-size:21px}
  body{font-size:15.5px}
  /* 탭: 가로 스크롤 + 큰 터치 타깃 */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0;margin:0 -16px 20px;padding:0 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;min-height:48px;padding:12px 14px;font-size:15px;white-space:nowrap}
  /* 보기 버튼: 풀너비 터치 타깃 */
  .opt{min-height:48px}
  .qflag{min-height:38px;padding:6px 12px}
  .main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="jsWarn"><b>버튼이 눌리지 않나요?</b>파일 "미리보기(QuickLook)"로 열면 동작하지 않습니다. 공유 버튼 → <b style="display:inline">Safari / Chrome 브라우저로 열기</b>를 선택해 주세요.</div>
<script>document.getElementById('jsWarn').remove();</script>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="nav" id="nav">
    <div class="nav-head">
      <p class="kicker">made by bless</p>
      <h1>소방안전관리자 2급 학습반</h1>
      <div class="meter">
        <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
        <div class="meter-txt"><span id="meterL">진도 0%</span><span id="meterR">0 / 0</span></div>
      </div>
    </div>
    <div id="navBody"></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button id="navBtn" aria-label="메뉴 열기">☰</button>
      <span class="t" id="topTitle">소방안전관리자 2급</span>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>
<div id="hlBar"><button data-hladd>🖊 형광펜 긋기</button></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 데이터  —  이론/문제는 아래 배열에 계속 추가하면 됩니다.
      (또는 좌측 '데이터 관리'에서 JSON으로 통째 주입)
   ========================================================= */
const CH = [
  {id:'ch1', no:'01', title:'소방관계법령',
   subs:['소방안전관리 제도','소방기본법','화재의 예방 및 안전관리에 관한 법률','소방시설 설치 및 관리에 관한 법률','건축관계법령']},
  {id:'ch2', no:'02', title:'소방학개론',
   subs:['연소이론','화재이론','소화이론']},
  {id:'ch3', no:'03', title:'화기취급 감독 및 화재위험작업 허가·관리',
   subs:['화기취급작업 안전관리규정','화재위험작업 허가·관리','위험물 안전관리','전기 안전관리','가스 안전관리']},
  {id:'ch4', no:'04', title:'피난시설·방화구획 및 방화시설의 관리',
   subs:['피난시설 관리','방화구획','방화시설']},
  {id:'ch5', no:'05', title:'소방시설의 종류 및 구조·점검',
   subs:['소방시설의 종류','소화설비','경보설비','피난구조설비','소화활동설비']},
  {id:'ap1', no:'06', title:'소방계획 및 자위소방대', appendix:true,
   subs:['소방계획 수립','자위소방대·초기대응체계','화재대응 및 피난','업무수행 기록의 작성·유지']},

{h:'선임자격 · 소방안전관리보조자', body:`**2급 소방안전관리자로 선임 가능한 사람** (자격증 발급 기준)
· **위험물기능장 · 위험물산업기사 · 위험물기능사** 자격 보유자
· 소방공무원으로 **3년 이상** 근무한 경력자
· 2급 강습교육을 수료하고 **시험에 합격**한 사람
· 특급·1급 소방안전관리자 자격 보유자(상위 자격은 하위 등급 선임 가능)
※ 소방설비기사·산업기사는 1급 자격이므로 당연히 2급 선임 가능

**소방안전관리보조자 선임 대상**
· **300세대 이상 아파트** → 초과 300세대마다 1명 추가
· 연면적 **1만5천㎡ 이상** 특정소방대상물 → 초과 1만5천㎡마다 1명 추가
· 공동주택(기숙사), 의료시설, 노유자시설, 수련시설
· 숙박시설 (바닥면적 합계 1,500㎡ 미만이고 관계인이 24시간 상시 근무하는 경우 제외)`},

{h:'선임 · 신고 기한 (30일 / 14일)', body:`**선임**: 소방안전관리자를 선임해야 하는 사유가 발생한 날부터 **30일 이내** 선임
→ 신축·증축으로 대상물이 된 경우: 완공일(사용승인일)
→ 소방안전관리자를 해임한 경우: 해임한 날
→ 증축·용도변경으로 등급이 변경된 경우: 증축공사 완공일 또는 용도변경 사실을 건축물관리대장에 기재한 날

**신고**: 선임한 날부터 **14일 이내** 소방본부장 또는 소방서장에게 신고

**게시**: 선임 사실과 소방안전관리자의 성명·연락처 등을 대상물 출입이 쉬운 곳에 **게시**

**벌칙 연결** (앞의 벌칙 총정리와 동일)
· 선임하지 않음 → **300만원 이하 벌금**
· 선임신고를 기간 내 하지 않음 → **200만원 이하 과태료**
· 선임명령 위반 → 3년 이하 징역 또는 3천만원 이하 벌금`},

{h:'관계인의 업무 vs 소방안전관리자의 업무', body:`**특정소방대상물 관계인의 업무** (소방안전관리자 선임 대상이 아니어도 수행)
· 피난시설·방화구획 및 방화시설의 관리
· 소방시설이나 그 밖의 소방 관련 시설의 관리
· 화기취급의 감독
· 화재 발생 시 초기대응

**소방안전관리대상물 소방안전관리자의 업무** (위 4가지 + 아래)
· **소방계획서**의 작성 및 시행
· **자위소방대** 및 초기대응체계의 구성·운영·교육
· 피난계획의 수립·시행 및 **피난유도**
· **소방훈련 및 교육**
· 화재 발생 시 초기대응
· **업무 수행에 관한 기록·유지**

**업무수행 기록** — 숫자 빈출
· **월 1회 이상** 작성·관리
· 작성일부터 **2년간** 보관
· 소방시설 등의 결함을 발견한 경우 지체 없이 관계인에게 알리고 기록`},

{h:'소방안전관리 업무의 대행', body:`관계인은 관리업자에게 소방안전관리 업무를 **대행**하게 할 수 있습니다.

**대행이 가능한 대상물** — "1급 일부 + 2급 + 3급"
· 지상층의 층수가 **11층 이상**인 **1급** 대상물 (단, **연면적 1만5천㎡ 이상**과 **아파트는 제외**)
· **2급** 소방안전관리대상물
· **3급** 소방안전관리대상물
→ 특급과 연면적 1만5천㎡ 이상 1급은 대행 불가

**대행이 가능한 업무** — 딱 2가지
· **피난시설, 방화구획 및 방화시설의 관리**
· **소방시설이나 그 밖의 소방 관련 시설의 관리**
→ 소방계획서 작성, 자위소방대 운영, 훈련·교육 등 나머지 업무는 대행 불가 (선임된 소방안전관리자가 직접 수행)

대행 시에도 소방안전관리자는 선임해야 하며, 대행 업무를 **감독**할 수 있는 사람을 선임할 수 있습니다.`},

{h:'건설현장 소방안전관리대상물', body:`신축·증축·개축·재축·이전·용도변경 또는 **대수선**을 하려는 부분이 다음에 해당하면, 착공 신고일부터 사용승인일까지 **건설현장 소방안전관리자**를 선임해야 합니다.

**대상 기준**
① 해당 부분의 연면적 합계가 **1만5천㎡ 이상**
② 해당 부분의 연면적이 **5천㎡ 이상**이면서 다음 중 하나에 해당
  · **지하 2개 층 이상**
  · **지상 11층 이상**
  · **냉동창고 · 냉장창고 · 냉동냉장창고**

**건설현장 소방안전관리자의 업무**
· 건설현장 소방계획서의 작성
· **임시소방시설**의 설치 및 관리에 대한 감독
· 공사진행 단계별 피난안전구역·피난로 등의 확보와 관리
· 건설현장 작업자에 대한 소방안전 교육·훈련
· 초기대응체계의 구성·운영·교육
· 화기취급의 감독, 화재위험작업의 허가 및 관리`},

{h:'소방안전관리자 교육 (강습 · 실무)', body:`**강습교육**: 자격 취득을 위한 교육 (선임 전) — 한국소방안전원 실시

**실무교육**: 선임된 후 받는 교육 — 한국소방안전원 실시
· 선임된 날부터 **6개월 이내**에 최초 실무교육
· 그 후 **2년마다**(최초 실무교육을 받은 날을 기준으로) 1회 이상
· 소방안전관리 **강습교육 또는 실무교육을 받은 후 1년 이내**에 선임된 경우, 해당 교육을 받은 날에 최초 실무교육을 받은 것으로 봄
· 소방안전관리**보조자**도 동일하게 실무교육 대상

**벌칙 확인** — 앞의 "벌칙 총정리 ②"에 이미 포함된 내용
· 실무교육을 받지 않은 소방안전관리자·보조자 → **100만원 이하 과태료**
· 미선임 300만원 이하 벌금 / 신고 지연 200만원 이하 과태료 / 선임명령 위반 3년·3천`},

{h:'[소방시설법] 소방시설의 분류 — 5가지', body:`**소화설비**: 물 또는 그 밖의 소화약제를 사용하여 소화하는 기계·기구·설비
→ 소화기구, 자동소화장치, 옥내소화전, 스프링클러, 물분무등소화설비, 옥외소화전

**경보설비**: 화재 발생 사실을 통보하는 기계·기구·설비
→ 자동화재탐지설비, 비상경보설비, 비상방송설비, 자동화재속보설비, 누전경보기, 가스누설경보기, 시각경보기, 단독경보형감지기

**피난구조설비**: 화재 시 피난하기 위하여 사용하는 기구·설비
→ 피난기구(완강기·구조대·피난사다리 등), 인명구조기구(방열복·공기호흡기·인공소생기), 유도등·유도표지, 비상조명등

**소화용수설비**: 소화에 필요한 물을 공급하거나 저장하는 설비
→ 상수도소화용수설비, 소화수조·저수조

**소화활동설비**: 화재를 진압하거나 인명구조 활동을 위하여 사용하는 설비
→ **제연설비, 연결송수관설비, 연결살수설비, 비상콘센트설비, 무선통신보조설비, 연소방지설비** (제·연·연·비·무·연)`},

{h:'[소방시설법] 무창층 · 피난층', body:`**무창층(無窓層)**: 지상층 중 다음 요건을 모두 갖춘 개구부 면적의 합계가 해당 층 **바닥면적의 1/30 이하**가 되는 층

**개구부 인정 요건** — 5가지 전부 암기
① 크기: 지름 **50cm 이상의 원**이 통과할 수 있을 것
② 높이: 해당 층 바닥면으로부터 개구부 밑부분까지 **1.2m 이내**일 것
③ **도로 또는 차량 진입이 가능한 빈터**를 향할 것
④ 화재 시 쉽게 피난할 수 있도록 **창살이나 장애물이 설치되지 않을 것**
⑤ 내부 또는 외부에서 **쉽게 부수거나 열 수 있을 것**

**피난층**: **곧바로 지상으로 갈 수 있는 출입구가 있는 층**
→ 반드시 1층만을 의미하지 않음(경사지 건물은 여러 층이 피난층일 수 있음)`},

{h:'[소방시설법] 관계인의 의무와 벌칙', body:`**관계인의 의무**
· 소방시설을 **화재안전기준에 따라 설치·관리**
· 소방시설의 기능과 성능에 지장을 줄 수 있는 **폐쇄(잠금 포함)·차단 행위 금지**
· **피난시설·방화구획·방화시설**의 폐쇄·훼손·변경 등 금지
· 소방시설 등의 **자체점검** 실시 및 결과 보고

**벌칙 정리**
· 소방시설 **폐쇄·차단**: **5년 이하 징역 또는 5천만원 이하 벌금** → 상해 시 7년/7천만원, **사망 시 10년/1억원**
· 조치명령 위반: 3년 이하 징역 또는 3천만원 이하 벌금
· **자체점검 미실시**: **1년 이하 징역 또는 1천만원 이하 벌금**
· 소방시설을 화재안전기준에 따라 설치·관리하지 않음: **300만원 이하 과태료**
· 피난시설·방화구획·방화시설의 폐쇄·훼손·변경: **300만원 이하 과태료**
· 점검 결과 **미보고·거짓 보고**: **300만원 이하 과태료**`},

{h:'[소방시설법] 주택용 소방시설', body:`**대상 주택**: 단독주택, 공동주택(**아파트 및 기숙사는 제외**)
→ 아파트·기숙사는 특정소방대상물로서 별도의 소방시설 설치 대상이기 때문

**설치해야 하는 주택용 소방시설** — 2가지
· **소화기**: 세대별·층별 1개 이상
· **단독경보형감지기**: 구획된 실마다 설치

단독경보형감지기는 배선 공사 없이 건전지로 작동하며, 감지기 자체에서 경보를 발합니다.`},

{h:'[소방시설법] 방염 (防炎)', body:`**방염**: 불에 잘 타지 않도록 처리하는 것. 커튼·카펫 등에서 화재 확산을 늦추는 목적

**방염성능기준 이상을 사용해야 하는 특정소방대상물** (주요)
· 근린생활시설 중 의원·조산원·산후조리원, 체력단련장
· 공연장·종교집회장, 문화 및 집회시설, 종교시설, 운동시설(**수영장 제외**)
· 의료시설, 교육연구시설 중 합숙소, 노유자시설, 숙박 가능한 수련시설, 숙박시설
· 방송국·촬영소, **다중이용업소**
· **층수 11층 이상**인 것(**아파트 제외**)

**방염대상물품**
· **선처리물품**(제조·가공 단계에서 방염처리): 커튼류(블라인드 포함), 카펫, 벽지류(두께 2mm 미만 종이벽지 제외), 전시용·무대용 합판·목재·섬유판, 암막·무대막, 단란주점·유흥주점·노래연습장의 섬유류·합성수지류 소파·의자
· **현장처리물품**(설치 현장에서 방염처리): 목재·합판 등을 현장에서 방염처리한 것

**방염처리를 권장할 수 있는 경우**
· 다중이용업소·의료시설·노유자시설·숙박시설·장례시설에서 사용하는 **침구류, 소파, 의자**
· 건축물 내부의 **벽면에 부착하는 가구류**

**방염성능검사 실시기관** — 비교 빈출
· **선처리물품** → **한국소방산업기술원**
· **현장처리물품** → **시·도지사**`},

{h:'[소방시설법] 자체점검 ① 작동점검', body:`**작동점검**: 소방시설 등을 **인위적으로 조작하여 정상 작동 여부를 점검**하는 것

**작동점검 제외 대상** — 3가지
① 소방안전관리자를 **선임하지 않는** 특정소방대상물
② **위험물제조소등**
③ **특급** 소방안전관리대상물 (특급은 종합점검을 반기별로 하므로 작동점검이 따로 없음)

**점검 횟수**: **연 1회 이상**

**점검 시기**
· 종합점검 대상: **종합점검을 받은 달부터 6개월이 되는 달**에 실시
· 그 외: 사용승인일이 속하는 달의 말일까지

**점검 기술인력**
· 간이스프링클러설비 또는 자동화재탐지설비만 설치된 대상: **관계인, 소방안전관리자, 관리업자**(소방시설관리사 참여) 등이 점검 가능
· 그 외 대상: **관리업자**(소방시설관리사 참여) 또는 소방시설관리사·소방기술사 자격이 있는 소방안전관리자`},

{h:'[소방시설법] 자체점검 ② 종합점검', body:`**종합점검**: 작동점검을 포함하여, 설비별 주요 구성 부품의 구조기준이 **화재안전기준과 건축법 등 관계 법령에 적합한지까지 점검**하는 것

**종합점검 대상** (주요)

**점검 구분과 횟수**

**점검 기술인력**: **관리업자**(소방시설관리사 참여) 또는 소방시설관리사·소방기술사 자격이 있는 소방안전관리자`},

{h:'[소방시설법] 자체점검 결과 조치 (10일 / 15일)', body:`숫자 두 개만 정확히 구분하면 됩니다.

**① 관리업자 → 관계인**: 점검이 끝난 날부터 **10일 이내**에 점검 결과(소방시설등 자체점검 실시결과 보고서)를 관계인에게 **제출**

**이행계획**: 보고를 받은 소방본부장·소방서장은 수리·정비가 필요한 경우 이행계획 수립·시행을 명할 수 있고, 관계인은 완료 후 이행 결과를 보고

**중대위반사항 발견 시**: 관리업자 등은 지체 없이 관계인에게 알리고, 관계인은 수리 등 필요한 조치

**관련 벌칙**
· 자체점검 미실시 → **1년 이하 징역 또는 1천만원 이하 벌금**

{h:'[건축법] 건축물 · 건축설비 · 지하층 · 거실 · 주요구조부', body:`**건축물**: 토지에 정착(定着)하는 공작물 중 **지붕과 기둥 또는 벽이 있는 것**과 이에 딸린 시설물, 지하나 고가의 공작물에 설치하는 사무소·공연장·점포·차고·창고 등

**건축설비**: 건축물에 설치하는 전기·전화·초고속정보통신·지능형홈네트워크·가스·급수·배수·**환기·난방·냉방·소화·배연**·오물처리 설비, 굴뚝, 승강기, 피뢰침 등
→ **배연설비(건축법)와 제연설비(소방시설법·소화활동설비)는 서로 다른 설비**입니다. 배연설비는 건축법상 실내 연기를 배출하는 창·배연구, 제연설비는 소방법상 소화활동설비 — 혼동 유도 단골

**지하층**: 건축물의 바닥이 지표면 아래에 있는 층으로서 바닥에서 지표면까지의 평균높이가 해당 층 **높이의 1/2 이상**인 것

**거실**: 건축물 안에서 거주·집무·작업·집회·오락 등의 목적을 위하여 사용되는 방
→ 복도·계단·화장실·창고 등은 거실이 아님

**주요구조부** — "내·기·바·보·지·주"
**내력벽, 기둥, 바닥, 보, 지붕틀, 주계단**
→ 제외: **사잇기둥, 최하층 바닥, 작은 보, 차양, 옥외계단** 등 (구조상 중요하지 않은 부분)`},

{h:'[건축법] 건축의 종류 (신축·증축·개축·재축·이전)', body:`**신축**: 건축물이 없는 대지(기존 건축물이 철거·멸실된 대지 포함)에 **새로 건축물을 축조**하는 것

**증축**: 기존 건축물이 있는 대지에서 건축물의 **건축면적·연면적·층수 또는 높이를 늘리는 것**

**개축(改築)**: 기존 건축물의 전부 또는 일부를 **스스로 철거**하고 그 대지에 종전과 같은 규모의 범위에서 다시 축조하는 것

**재축(再築)**: 건축물이 **천재지변이나 그 밖의 재해로 멸실**된 경우 그 대지에 종전 규모 이하로 다시 축조하는 것

**이전**: 건축물의 주요구조부를 해체하지 아니하고 **같은 대지의 다른 위치로 옮기는 것**

암기 포인트: 개축은 "내가 스스로 철거", 재축은 "재해로 멸실" — 철거의 원인으로 구분합니다.`},

{h:'[건축법] 면적의 산정 (건폐율 · 용적률)', body:`**건축면적**: 건축물 외벽의 중심선으로 둘러싸인 부분의 **수평투영면적** (1층 바닥 크기 개념, 처마·차양은 일정 부분 제외)

**바닥면적**: 각 층 또는 그 일부로서 벽·기둥 중심선으로 둘러싸인 부분의 수평투영면적

**연면적**: 하나의 건축물 **각 층 바닥면적의 합계**
→ 단, **용적률 산정 시**에는 지하층 면적, 지상층의 부속용도 주차장 면적, 피난안전구역 면적 등은 **제외**

**건폐율** = **건축면적 ÷ 대지면적** × 100
→ 대지를 얼마나 "넓게" 덮었는가 (수평적 밀도)

**용적률** = **연면적 ÷ 대지면적** × 100
→ 대지에 얼마나 "높게·많이" 지었는가 (입체적 밀도)

건폐율은 건축면적, 용적률은 연면적 — 분자만 바꿔 출제됩니다.`},

{h:'[건축법] 방화구획 · 방화문 · 방화셔터', body:`**방화구획**: 화재가 번지는 것을 막기 위해 내화구조의 바닥·벽과 방화문·방화셔터 등으로 건축물을 구획하는 것
· **면적별**: 10층 이하의 층 — 바닥면적 **1,000㎡ 이내**마다 (스프링클러 등 자동식 소화설비 설치 시 **3,000㎡ 이내**)
· **층별**: **매 층마다** 구획 (지하 1층에서 지상으로 직통하는 경사로 부위 제외)
· 11층 이상의 층: 바닥면적 **200㎡ 이내**마다 (자동식 소화설비 시 600㎡, 내장재가 불연재이면 500㎡/1,500㎡)

**방화문의 구분** — 3종류
· **60분+ 방화문**: 연기·불꽃 **60분 이상** 차단 + **열을 30분 이상** 차단
· **60분 방화문**: 연기·불꽃을 60분 이상 차단
· **30분 방화문**: 연기·불꽃을 30분 이상 60분 미만 차단
→ 방화문은 언제나 **닫힌 상태**를 유지하거나, 화재 시 연기·온도에 의해 **자동으로 닫히는 구조**여야 함

**방화셔터**
· 내화구조 벽을 설치하지 못하는 개구부(넓은 통로 등)에 설치하는 셔터
· **불꽃·연기 감지 시 일부 폐쇄(일부작동), 열 감지 시 완전 폐쇄**되는 구조
· 셔터 인근에는 피난을 위한 **60분+ 또는 60분 방화문**을 셔터로부터 **3m 이내**에 별도로 설치`}

{h:'연소의 3요소와 4요소', body:`**연소**: 가연물이 공기 중의 산소 또는 산화제와 반응하여 **열과 빛을 내는 급격한 산화현상**

**연소의 3요소**
· **가연물**: 탈 수 있는 물질 (목재, 종이, 가솔린, 가연성 가스 등)
· **산소공급원**: 공기(산소 약 21%), 산화성 물질(1류·6류 위험물), 자기반응성 물질(5류)
· **점화원**: 불꽃, 전기불꽃, 정전기, 마찰열, 충격 스파크, 단열압축, 나화(裸火) 등

**연소의 4요소** = 3요소 + **연쇄반응**
→ 연소가 계속 이어지게 하는 라디칼의 연속 반응

소화이론과의 연결:
가연물 제거 → **제거소화** / 산소 차단 → **질식소화** / 점화원(열) 제거 → **냉각소화** / 연쇄반응 차단 → **억제소화**(부촉매소화, 화학적 소화)`},

{h:'가연물의 구비조건 · 가연물이 될 수 없는 물질', body:`**가연물이 되기 쉬운 조건**
· 산소와 결합할 때 **발열량이 클 것**
· **열전도율이 작을 것** (열이 축적되어야 함 — "클 것"으로 나오면 오답)
· 산소와 친화력이 좋고 **표면적이 넓을 것** (톱밥이 통나무보다 잘 탐)
· **활성화 에너지가 작을 것** (적은 에너지로 불이 붙음)
· 연쇄반응을 일으킬 수 있을 것

**가연물이 될 수 없는 물질** — 3가지 유형
① 산소와 반응하지만 **흡열반응**을 하는 물질: **질소(N₂)와 질소산화물**
② 이미 산소와 결합하여 **더 이상 산화되지 않는** 완전산화물: **이산화탄소(CO₂), 물(H₂O)**, 오산화인 등
③ 산소와 화학반응을 일으키지 않는 **불활성 기체**: 헬륨, 네온, 아르곤 등

**산소 농도와 연소**: 공기 중 산소는 약 21%. 일반적으로 산소 농도가 **15% 이하**로 떨어지면 연소가 지속되기 어려움 → 질식소화의 원리(가스계 소화설비는 산소 농도를 15% 이하로 낮춤)`},

{h:'산소공급원 — 공기 밖에서 오는 산소', body:`산소공급원은 공기만이 아닙니다. 위험물과 연결해서 출제됩니다.

**① 공기**: 산소 약 21% 함유 — 가장 일반적인 산소공급원

**② 산화성 물질** — 자신은 타지 않지만 산소를 내어 다른 물질의 연소를 돕는 물질
· **제1류 위험물(산화성 고체)**: 아염소산염류, 염소산염류, 질산염류 등
· **제6류 위험물(산화성 액체)**: 과염소산, 과산화수소, 질산
→ 가열·충격 시 분해되어 산소 방출

**③ 자기반응성 물질** — 분자 내에 산소를 함유하여 **외부 산소 없이도 연소**
· **제5류 위험물**: 유기과산화물, 질산에스터류(니트로글리세린 등), 니트로화합물(TNT 등)
· 연소 속도가 매우 빠르고 폭발적 → **질식소화 효과 없음**, 대량의 물로 냉각소화

3부 위험물 안전관리에서 1류·5류·6류가 다시 나오므로 여기서 역할(산소를 주는 쪽)을 잡아두면 한 번에 정리됩니다.`},

{h:'연소 용어 ① 인화점', body:`**인화점(引火點)**: 외부의 **점화원에 의해** 불이 붙을 수 있는 **최저온도**

{h:'연소 용어 ② 발화점 · 연소점', body:`**발화점(착화점)**: **점화원 없이** 축적된 열만으로 스스로 불이 붙는 최저온도

**연소점(燃燒點)**: 점화원을 제거해도 **연소가 계속 지속**될 수 있는 최저온도
→ 통상 **인화점보다 5~10℃ 높음**
→ 인화점에서는 불이 잠깐 붙었다 꺼질 수 있지만, 연소점부터는 계속 탄다

**온도의 크기 순서**: **인화점 < 연소점 < 발화점** (예외 없이 이 순서)`},

{h:'연소범위 (폭발범위)', body:`**연소범위**: 가연성 가스가 공기와 혼합하여 연소(폭발)할 수 있는 **농도 범위** (하한계 ~ 상한계, vol%)
· 하한계 미만: 가스가 너무 희박해서 연소 불가
· 상한계 초과: 가스가 너무 진해서(산소 부족) 연소 불가
· **범위가 넓을수록, 하한계가 낮을수록 위험**
· 온도·압력이 높아지면 연소범위는 대체로 **넓어짐**

**주요 가스의 연소범위** (vol%, 대표값)

**아세틸렌 : 2.5 ~ 81** ← 범위가 가장 넓음 (최빈출)
**수소 : 4 ~ 75**
일산화탄소 : 12.5 ~ 74
암모니아 : 15 ~ 28
메탄 : 5 ~ 15
프로판 : 2.1 ~ 9.5
부탄 : 1.8 ~ 8.4
**휘발유 : 1.2 ~ 7.6** ← 하한계가 낮아 소량 누출로도 위험

출제 유형: "연소범위가 가장 넓은 것은?" → 아세틸렌 / "하한계가 가장 낮은 것은?" → 휘발유(부탄) 계열 비교`},

{h:'화재의 분류 (A급 ~ K급)', body:`| 급수 | 종류 | 표시색 | 대상 | 주된 소화방법
**A급 | 일반화재 | 백색** | 목재·종이·섬유·플라스틱 | 물로 **냉각소화**
**B급 | 유류화재 | 황색** | 휘발유·등유 등 인화성 액체, 가스 | 포·분말 등 **질식소화** (주수 시 연소면 확대 위험)
**C급 | 전기화재 | 청색** | 통전 중인 전기설비 | 이산화탄소·분말 등 **질식소화** (물 사용 금지 — 감전)
**D급 | 금속화재 | 무색** | 마그네슘·나트륨·칼륨 등 | **마른모래, 금속화재용 분말** (물 절대 금지 — 수소 발생 폭발)
**K급 | 주방화재 | — ** | 식용유·동식물유 | **K급 소화기**(강화액, 비누화 작용으로 재발화 방지)

암기: 백·황·청·무 (A·B·C·D 순서)

식용유 화재에 일반 물을 뿌리면 기름이 튀며 화재가 확대되고, B급용 소화기만으로는 재발화하기 쉬워 **K급 소화기**가 별도로 필요합니다.`},

{h:'열전달 (전도 · 대류 · 복사)', body:`**전도(傳導)**: 물질의 **직접 접촉**을 통해 열이 이동
→ 고체 내부의 열 이동. 금속이 잘 전달, 열전도율이 작은 물질(목재·솜)은 열이 축적되어 가연물이 되기 쉬움

**대류(對流)**: **유체(액체·기체)의 흐름**에 의해 열이 이동
→ 뜨거운 공기는 위로, 찬 공기는 아래로. **실내 화재에서 상층부로 화재가 확대**되는 주된 원인, 연기의 이동 원리

**복사(輻射)**: 열이 **전자기파** 형태로 매개체 없이 직접 전달
→ 태양열이 지구에 도달하는 원리. **인접 건물로 화재가 옮겨붙는(연소 확대) 주된 원인**
→ 복사열은 절대온도의 4제곱에 비례 (온도가 2배면 복사열은 16배)

+ 참고: 화염이 직접 접촉하여 옮는 것은 **접염**, 불티가 바람에 날려 옮는 것은 **비화** — 열전달 3형태와 함께 화재 확산 경로로 출제됩니다.`}
,

{h:'연소생성물과 연기', body:`**연소생성물 4가지**: 열, 빛(화염), 연기, 연소가스

**주요 연소가스**
· **일산화탄소(CO)**: **불완전연소** 시 발생. 무색·무취. 헤모글로빈과의 결합력이 산소의 약 200배 이상 → 산소 운반 방해, 화재 사망의 최대 원인
· 이산화탄소(CO₂): 완전연소 시 발생. 자체 독성은 낮지만 농도가 오르면 호흡이 빨라져 다른 유독가스를 더 많이 흡입하게 만듦
· **포스겐(COCl₂)**: **염소 성분 물질(PVC, 프레온 등)**이 연소·열분해할 때 발생하는 **맹독성 가스**
· 시안화수소(HCN): 우레탄·나일론 등 질소 함유 물질 연소 시 발생, 맹독성
· 황화수소(H₂S): 고무·황 함유 물질 연소 시 발생, 계란 썩는 냄새

**연기의 이동속도** — 숫자 빈출
· **수평 방향: 0.5 ~ 1 m/s**
· **수직 방향: 2 ~ 3 m/s**
· **계단실 등 수직공간: 3 ~ 5 m/s** (가장 빠름 — 계단으로 연기가 급속히 퍼지는 이유)
→ 수직 방향 연기는 사람의 보행속도보다 훨씬 빠르므로 조기 피난이 핵심`},

{h:'화재의 진행 단계 · 플래시오버 · 백드래프트', body:`**실내 화재의 진행 단계** — 순서 암기
**초기(발화기) → 성장기 → 최성기 → 감쇠기(쇠퇴기)**
· 초기: 발화·연기 발생 — 초기소화가 가능한 단계
· 성장기: 천장으로 화염 확대, 온도 급상승
· 최성기: 실 전체 화염, 최고 온도
· 감쇠기: 가연물 소진, 온도 하강

**플래시오버(Flash-over)**
· **성장기에서 최성기로 넘어가는 시점**에 발생
· 실내에 축적된 가연성 가스가 일시에 착화 → **실 전체가 순간적으로 화염에 휩싸임**
· 플래시오버 이후에는 생존이 사실상 불가능 → 그 전에 피난 완료

**백드래프트(Back-draft)**
· 밀폐 공간에서 **산소 부족** 상태로 훈소하던 중, 문 개방 등으로 **산소가 급격히 유입**되며 폭발적으로 연소
· 예방: 문 개방 전 손등으로 온도 확인, 상부 배연 후 진입

비교: 플래시오버 = "열 축적 → 가스 착화" / 백드래프트 = "산소 유입 → 폭발"`},

{h:'소화이론 — 4가지 소화방법', body:`연소의 4요소 중 하나 이상을 제거하면 소화됩니다.

**① 제거소화** — 가연물 제거
· 가스밸브 차단, 산불 시 벌목(방화선), 촛불을 불어 끄기(가연성 증기 제거)

**② 질식소화** — 산소 차단
· 공기 중 **산소 농도를 15% 이하**로 낮추면 연소 지속 불가
· CO₂ 등 가스계 약제, 포(거품), 마른모래, 담요·뚜껑 덮기

**③ 냉각소화** — 점화원(열) 제거
· 온도를 인화점·발화점 아래로 낮춤 — **물이 대표적**(증발잠열이 큼)

**④ 억제소화(부촉매소화)** — 연쇄반응 차단
· 연쇄반응을 화학적으로 억제하는 **화학적 소화** (나머지 셋은 물리적 소화)
· **할론, 할로겐화합물, 분말** 소화약제

연결 암기: 가연물-제거 / 산소-질식 / 열-냉각 / 연쇄반응-억제`}
  ],
  ch3:[
{h:'화기취급작업 안전관리 (불티 11m)', body:`**화기취급작업**: 용접·용단·연마·드릴 등 불꽃을 발생시키거나 점화원이 될 수 있는 작업

**용접·용단 불티의 특성**
· 불티는 약 **11m까지 비산** (풍향·풍속에 따라 그 이상)
· 작업 반경 **11m 이내의 가연물은 제거**, 제거 곤란 시 **불받이포(용접방화포)** 등으로 방호
· 불티는 작아도 오래 잔존하여 **수 시간 뒤 발화**하는 경우가 많음 → 작업 후 확인이 중요한 이유

**불티 비산방지 조치**
· 용접불티 **비산방지덮개**, **용접방화포** 설치
· 바닥·벽 개구부(틈새)를 통한 불티 유입 차단
· 인근 가연성 물질 방호조치 및 **소화기구 비치**`},

{h:'화재위험작업 허가·관리 (안전조치 5가지)', body:`**작업 절차**: 작업 요청 → 허가서 검토·**승인** → 안전조치 확인 → 작업·감독 → 완료 확인

**화재위험작업 시 안전조치 5가지** — 세트 암기
① 작업 준비 및 **작업 절차 수립**
② 작업장 내 **위험물의 사용·보관 현황 파악**
③ 인근 **가연성물질에 대한 방호조치** 및 **소화기구 비치**
④ 용접불티 **비산방지덮개·용접방화포** 등 불꽃·불티 **비산방지조치**
⑤ 인화성 액체의 증기·인화성 가스가 남지 않도록 **환기** 조치

**화재감시자**
· **화기작업 허가권자(소방안전관리자 등 화재안전 감독자)가 지정·배치**
· 임무: 화재 감시 전담, 초기소화 준비, 비상시 통보 — **작업에 직접 참여하지 않음**

**허가서 게시**: 승인된 화기취급작업 허가서는 **작업 구역 내에 게시**

**작업 후 확인** — 숫자 빈출
· 화재감시자는 작업 완료 후 **30분 이상 현장에 상주**하며 잔불 확인
· 작업 종료 후 **최소 3시간까지** 일정 간격으로 작업장 **순찰·점검** (지연 발화 대비)`},

{h:'위험물 ① 정의·지정수량', body:`**위험물**: **인화성 또는 발화성** 등의 성질을 가지는 것으로서 **대통령령**이 정하는 물품

**지정수량**: 위험물 종류별로 위험성을 고려해 대통령령이 정하는 수량
→ **지정수량 이상**: 시·도지사의 **허가**를 받은 제조소등에서 저장·취급
→ 지정수량 미만: 시·도 **조례**로 규제

**주요 지정수량** (제4류는 L, 고체는 kg)
· **휘발유: 200L** (제1석유류)
· **알코올류: 400L**
· **등유 · 경유: 1,000L** (제2석유류)
· **중유: 2,000L** (제3석유류)
· **황: 100kg** (제2류)
· **질산: 300kg** (제6류)

암기 흐름: 휘발유 200 → 알코올 400 → 등·경유 1,000 → 중유 2,000 (2배씩) + 황 100 / 질산 300`},

{h:'위험물 ② 류별 특성 (1~6류)', body:`**제1류 — 산화성 고체**: 자신은 불연성, **산소를 방출**해 연소를 도움. 가열·충격·마찰 주의

**제2류 — 가연성 고체**: 낮은 온도에서 착화하기 쉽고 연소 속도가 빠름 (황, 적린, 마그네슘)

**제3류 — 자연발화성·금수성**: 공기 접촉 시 자연발화(황린), **물과 반응해 가연성 가스 발생**(나트륨·칼륨) → **주수소화 절대 금지**, 마른모래 등

**제4류 — 인화성 액체**: 증기가 공기보다 무거워 낮은 곳에 체류. 물보다 가볍고 안 섞이는 것이 많아 **주수 시 연소면 확대** → 포·분말 등 질식소화

**제5류 — 자기반응성**: 분자 내 산소 함유 → **외부 산소 없이 자기연소**, 폭발적 → **질식소화 무의미**, 초기 **대량 주수 냉각소화**

**제6류 — 산화성 액체**: 불연성, 산소를 내어 연소를 도움, 부식성 (과염소산, 과산화수소, 질산)

구조 암기: 산소를 주는 쪽 = **1류·6류** / 산소를 품고 스스로 타는 것 = **5류** / 물 금지 = **3류**`},

{h:'전기 안전관리 — 주요 화재원인', body:`**전기화재의 주요 원인**
· **단락(합선)**: 피복 손상 등으로 두 전선이 직접 접촉 — **전기화재 원인 중 최다**. 순간 대전류·스파크
· **과부하·과전류**: 허용전류 초과 사용(문어발식 콘센트) → 전선 과열
· **누전**: 절연 불량으로 전류가 새어 흘러 발열
· **접촉불량**: 접속부 이완·부식 → 접촉저항 증가 → 국부 발열
· **정전기**: 축적 전하의 방전 스파크 (유증기 체류 장소에서 특히 위험)
· 낙뢰, 전기기기 과열 등

**예방**: 문어발식 금지, 손상 전선 교체, **누전차단기 설치 + 월 1회 시험버튼 점검**, 접지, 플러그 완전 삽입
→ **접지는 원인이 아니라 예방조치** (원인 보기로 나오면 오답)`},

{h:'가스 안전관리 — LPG vs LNG', body:`**LPG (액화석유가스)**
· 주성분: **프로판 · 부탄**
· 비중: **공기보다 무겁다(약 1.5~2)** → 누설 시 **바닥에 체류**
· 용도: 가정·영업용 용기, 차량
· 폭발범위: 프로판 2.1~9.5% / 부탄 1.8~8.4%

**LNG (액화천연가스 = 도시가스)**
· 주성분: **메탄**
· 비중: **공기보다 가볍다(약 0.6)** → 누설 시 **천장으로 상승**
· 용도: 도시가스 배관 공급 / 폭발범위: 5~15%

**가스누설경보기(탐지부) 설치 위치** — 비중과 연결
· **LPG**: **바닥면에서 상방 30cm 이내** + 연소기로부터 수평거리 **4m 이내**
· **LNG**: **천장면에서 하방 30cm 이내** + 연소기로부터 수평거리 **8m 이내**

무거우면(LPG) 아래·가까이(4m), 가벼우면(LNG) 위·멀리(8m)`}
  ],
  ch4:[
{h:'피난시설 · 방화시설의 정의', body:`**피난시설** — 건축법에 따라 건축물에 설치되는, 피난에 사용되는 시설
· **계단**: 직통계단 · 피난계단 · 특별피난계단
· **복도**
· **출입구** (비상구 포함)
· **옥상광장**, **피난안전구역**
· 그 밖의 피난시설 (경사로, 피난용 승강기 등)

**계단의 구분** — 안전 수준 순서
· **직통계단**: 어떤 층에서든 **피난층·지상까지 곧바로 이어지는** 계단
· **피난계단**: 직통계단에 **내화구조 + 방화문** 등 안전 구조를 갖춘 것
· **특별피난계단**: 계단 진입 전 **부속실(전실·노대)을 거쳐** 들어가는 구조 — 연기 유입을 한 번 더 차단, 가장 안전

**방화시설** — 화재 확산을 막는 시설
· **방화문, 자동방화셔터**
· **내화구조의 벽·바닥** 등 방화구획을 이루는 시설

**혼동 주의**: 완강기·구조대·유도등·비상조명등은 **피난시설이 아니라 소방시설(피난구조설비)**입니다. "피난시설에 해당하지 않는 것" 문제의 단골 정답이 완강기·유도등입니다.`},

{h:'방화구획의 기준', body:`**방화구획**: 화염·연기 확산을 막기 위해 내화구조의 바닥·벽과 방화문·방화셔터 등으로 구획 (주요구조부가 내화구조·불연재료인 연면적 1,000㎡ 초과 건축물에 적용)

**면적별 구획** — 스프링클러 설치 시 3배 완화가 핵심
· **10층 이하의 층**: 바닥면적 **1,000㎡ 이내**마다 (자동식 소화설비 설치 시 **3,000㎡**)
· **11층 이상의 층**: **200㎡ 이내**마다 (자동식 소화설비 시 600㎡)
  — 내장재가 불연재료이면 **500㎡**(자동식 소화설비 시 1,500㎡)

**층별 구획**: **매 층마다** (지하 1층에서 지상으로 직접 연결되는 경사로 부위 제외)

**용도별 구획**: 주요 용도 부분과 다른 부분 사이 구획`},

{h:'방화구획의 구조 (구성 요소)', body:`**① 내화구조의 바닥·벽**: 구획의 기본 골격

**② 방화문**: 출입 개구부 — **60분+ / 60분 / 30분**
· 언제나 닫힌 상태 유지, 또는 화재 시 연기·온도 감지로 **자동으로 닫히는 구조**

**③ 자동방화셔터**: 방화문을 달 수 없는 넓은 개구부에 설치
· **연기 감지 시 일부 폐쇄 → 열 감지 시 완전 폐쇄** (2단계)
· 셔터 인근 **3m 이내**에 피난용 방화문(60분+ 또는 60분) 별도 설치

**④ 방화댐퍼**: 환기·냉난방 **덕트가 방화구획을 관통**하는 부분 — 화재 시 자동 폐쇄

**⑤ 내화충전구조**: 급수관·배전관·**케이블 관통부의 틈새**를 내화채움재로 밀실하게 메움

관통부 연결(덕트→댐퍼 / 배관·케이블→내화충전)을 바꿔 묻는 문제가 자주 나옵니다.`},

{h:'피난시설 등 금지행위와 벌칙', body:`**금지행위 유형** (피난시설·방화구획·방화시설)
① **폐쇄(잠금)**: 비상구·방화문 잠금, 계단·복도에 방범철책 설치
② **훼손**: 방화문 제거, 방화문에 **고임장치(도어스톱·말발굽)** 설치, 자동폐쇄장치 제거
③ **장애물 적치**: 계단·복도·비상구에 물건 쌓기
④ **변경**: 방화구획·마감재 임의 변경, 방화문을 유리문으로 교체
⑤ 그 밖에 피난·소방활동에 지장을 주는 행위

**벌칙**: **300만원 이하 과태료** (1차 100 / 2차 200 / 3차 300만원)

주의: 방화문을 **닫힌 상태로 유지**하는 것은 정상입니다. "**상시 개방 고정**"이 위반 행위입니다.`}
  ],
  ch5:[
{h:'소화기구 ① 분류·능력단위·약제', body:`**능력단위**: 소화 성능을 나타내는 수치 (예: A3 B5 C)

**대형소화기**: **A급 10단위 이상, B급 20단위 이상** (운반대·바퀴 부착)
**소형소화기**: 능력단위 1 이상 ~ 대형 미만

**가압식 vs 축압식**
· **가압식**: 내부에 별도 가압가스 용기 — 노후 시 **파열 위험, 생산 중단**(구형 교체 대상)
· **축압식**: 약제 + 질소가스 축압, **지시압력계** 부착
  → **정상범위 0.7 ~ 0.98MPa (녹색)** / 좌측(황) 압력 부족 / 우측(적) 과충전

**분말 소화약제**
· **ABC급: 제1인산암모늄 — 담홍색** (가장 널리 사용)
· BC급: 탄산수소나트륨 — 백색

**내용연수**: 분말소화기 **10년**

**이산화탄소(CO₂)소화기** — 비교 포인트
· 자체 증기압으로 방사 → **지시압력계가 없음** (축압식 분말과 구분)
· **내용연수 규정이 없음** (분말 10년과 구분)
· 주된 소화효과: **질식** (+ 방사 시 냉각 일부) / **B·C급** 적응, 잔재 없음`},

{h:'소화기구 — 분류 총정리 (3분류 · 자동소화장치 · 물분무등 9종)', body:`**소화기구의 3가지** — "소화기구"라는 큰 묶음
① **소화기** (소형·대형)
② **간이소화용구**
③ **자동확산소화기** (천장 부착, 화재 시 자동 방사)

**간이소화용구 4가지**
· **에어로졸식** 소화용구
· **투척용** 소화용구
· **소공간용** 소화용구
· **소화약제 외의 것**을 이용한 간이소화용구 — **마른모래, 팽창질석·팽창진주암**

**자동소화장치 6종** — 암기 "주·상·캐·가·분·고"
**주**거용 주방자동소화장치 / **상**업용 주방자동소화장치 / **캐**비닛형 / **가**스 / **분**말 / **고**체에어로졸 자동소화장치
→ 함정: **자동확산소화기는 자동소화장치가 아니라 소화기구**입니다 (이름이 비슷해 단골 오답)

**물분무등소화설비 9가지**
물분무 / **미분무** / 포 / 이산화탄소 / 할론 / 할로겐화합물 및 불활성기체 / 분말 / **강화액** / 고체에어로졸 소화설비
→ **옥내소화전 · 옥외소화전 · 스프링클러는 물분무등에 포함되지 않음** (별도 소화설비 — 아닌 것 찾기 단골 정답)
→ 물분무·미분무는 미세한 물입자로 **질식**(+냉각) 소화`},

{h:'소화기구 ② 설치기준·능력단위 산정', body:`**배치 거리**: 보행거리 **소형 20m 이내 / 대형 30m 이내**

**추가 배치**: 각 층 바닥면적 **33㎡ 이상으로 구획된 거실**(아파트는 세대)마다 별도 배치

**설치 높이**: 바닥으로부터 **1.5m 이하** + "소화기" **표지**(지하·무창층 등은 **축광식 표지**)

**능력단위 산정 — 용도별 기준면적 (1단위당)**
· 위락시설: **30㎡**
· 공연장·집회장·관람장·문화재·장례식장·의료시설: **50㎡**
· 근생·판매·운수·숙박·노유자·업무·공장·창고·**공동주택** 등: **100㎡**
· 그 밖의 것: **200㎡**
→ 공동주택은 **100㎡마다 1단위 이상**

**2배 완화**: 주요구조부가 **내화구조** + 실내 마감이 **불연·준불연·난연재료** → 기준면적의 **2배** 적용 (필요 단위가 절반)`},

{h:'옥내소화전 ① 수원·유효수량·기본 수치', body:`**핵심 수치**
· 방수압력: **0.17 ~ 0.7MPa** / 방수량: **130L/min 이상**
· 수원: **Q = N × 2.6㎥** (N = 가장 많은 층의 설치개수, **최대 2**) / 30~49층 ×5.2(N 최대 5) / 50층 이상 ×7.8
· 옥상수조: 유효수량의 **1/3 이상**
· 호스 구경: **40mm 이상** (호스릴 25mm)

**유효수량** — 일반 급수설비와 수조 겸용 시
· **일반 급수펌프의 풋밸브(흡수구)보다 아래 ~ 소화용 펌프의 풋밸브보다 위** 사이에 있는 물
→ 일반 급수를 다 써도 소화용 물이 항상 남도록 소화용 흡수구를 더 낮게 설치

**비상전원**: 20분(29층 이하) / 40분(30~49층) / 60분(50층 이상)`},

{h:'옥내소화전 ② 가압송수장치·체절운전·압력챔버', body:`**가압송수장치 4방식**: **펌프방식**(일반적) / 고가수조(자연낙차) / 압력수조 / 가압수조

**순환배관 · 체절운전 · 릴리프밸브**
· **체절운전**: 토출측 밸브를 잠근(유량 0) 상태의 운전 → 수온 상승·과열 위험
· **순환배관**(20mm 이상): 체절운전 시 물을 순환시켜 수온 상승 방지
· **릴리프밸브**: 순환배관에 설치, **체절압력 미만에서 개방**되도록 조정해 과압 방출
· 조정: 체절운전 상태에서 릴리프밸브 캡을 돌려 개방 압력을 설정

**기동용 수압개폐장치(압력챔버)**
· **용적 100L 이상**
· 구성: **안전밸브(최상단) · 압력스위치 · 압력계 · 개폐밸브 · 배수밸브**
· 역할 ① 배관 내 **압력 변동을 감지해 펌프 자동 기동·정지** (압력스위치)
· 역할 ② 압력 변동 **완충**(수격·맥동 방지)
· 압력스위치 설정: RANGE(정지압력) / DIFF(정지압과 기동압의 차)`},

{h:'옥내소화전 ③ 방수구·표시등·제어반', body:`**방수구**: **층마다** 설치, 수평거리 **25m 이하**, 바닥에서 **1.5m 이하**

**소화전함 표시등** — 두 가지 구분이 핵심
· **위치표시등**: 함 상부, 적색 — **평상시에도 상시 점등** (위치 안내용)
· **펌프기동표시등**: **펌프가 기동될 때만 점등** — 주펌프가 돌아야 켜짐

**동력제어반(MCC)** — 외함 **적색**, 그림 문제 빈출
· **펌프 자동/수동 절환스위치**: **평상시 "자동" 위치**, 펌프 수동기동 시에만 수동 위치 (점검 후 반드시 자동 복구!)
· **기동스위치(표시등)**: 펌프 수동기동 시 누름 — **평상시 소등, 기동 시 적색 점등**
· **정지스위치(표시등)**: 펌프 수동정지 시 누름 — **평상시 녹색 점등, 기동 시 소등**
· **펌프기동표시등**: 펌프가 기동 중일 때 점등 / POWER(전원)표시등: 전원 공급 상태

**감시제어반** — 수신·감시 기능
· 주펌프·충압펌프 PS 표시등, 수조·물올림탱크 저수위 감시, 예비전원 감시, 도통·동작시험 스위치, 수동 기동·정지
· **선택스위치: 평상시 "자동(연동)" 위치** — 수동·정지 위치면 화재 시 펌프 미기동(최다 관리 결함)
· **펌프 자동기동 시**: 배관 내 압력 저하 → **압력스위치 동작 → 압력스위치 표시등 점등** + 펌프 표시등 점등

상태 요약: 평상시 = 절환·선택스위치 "자동" + 정지등 **녹색 점등** / 기동 시 = 기동등 **적색 점등** + 정지등 소등`},

{h:'옥내소화전 ④ 점검 — 방수압 측정·펌프성능시험', body:`**방수압력 측정**
· **피토게이지** + **직사형 관창** 사용
· 노즐 선단에서 **노즐 구경의 1/2(D/2) 거리**에 피토게이지를 방수류 중심에 대고 측정
· 2개 이상이면 가장 불리한(먼) 소화전 포함 동시 방수 상태로 측정
· 판정: **0.17~0.7MPa / 130L/min 이상**

**펌프성능시험 — 3가지 운전** (숫자 세트: 0-140 / 100-100 / 150-65)
① **체절운전**: 유량 **0** → 체절압력이 **정격토출압력의 140% 이하**
② **정격부하운전**: **정격유량 100%** 방출 → 정격토출압력 **이상**
③ **최대운전(과부하)**: **정격유량의 150%** 방출 → **정격토출압력의 65% 이상**

절차: 성능시험배관 개폐밸브·유량조절밸브로 유량 조정 → 압력 확인 → 시험 후 밸브 복구 → 제어반 스위치 **"자동" 복구 확인**까지가 점검 완료`},

{h:'옥외소화전설비', body:`**핵심 수치** (옥내와 비교 암기)
· 방수압력: **0.25 ~ 0.7MPa** / 방수량: **350L/min 이상**
· 수원: **Q = N × 7㎥** (**N 최대 2**)
· 수평거리: **40m 이하** / 호스 구경: **65mm**

**옥외소화전함 설치 수량**
· 소화전 **10개 이하**: 소화전마다 **5m 이내에 1개 이상**
· **11~30개**: 소화전함 **11개 이상 분산** 설치
· **31개 이상**: 소화전 **3개마다 1개 이상**

**방수압·방수량 총정리표**
· 옥내소화전: **0.17~0.7MPa / 130L/min**
· 옥외소화전: **0.25~0.7MPa / 350L/min**
· 스프링클러: **0.1~1.2MPa / 80L/min**`},

{h:'스프링클러 ① 헤드·기준개수·수원', body:`**헤드 방수 기준**: **0.1 ~ 1.2MPa / 80L/min 이상**

**수원**: Q = **기준개수 × 1.6㎥** / 30~49층 ×3.2 / 50층 이상 ×4.8

**기준개수** (폐쇄형)
· **아파트(공동주택): 10개** — 층수 무관
· 11층 이상(아파트 제외)·지하가·지하역사: **30개**
· 판매시설(복합 포함)·특수가연물 공장: 30개 / **주차장: 30개**
· 그 밖의 공장·근생·운수: 20개
· 그 외 — 헤드 부착높이 8m 이상 20개 / 8m 미만 10개

**특수 헤드**
· **조기반응형**: 조기에 감열 작동 — **공동주택·노유자시설 거실, 오피스텔·숙박시설 침실, 병원 입원실**
· **라지드롭형**: 큰 물방울로 강한 화세 제어 — **랙크식 창고** 등 창고시설

**배관**: 교차배관 → **가지배관**(헤드 부착, 한쪽에 헤드 **8개 이하**) / 유수검지장치(알람밸브 등)를 거쳐 급수`},

{h:'스프링클러 ② 4종 방식 비교', body:`유수검지장치 기준 **1차측(펌프 쪽) / 2차측(헤드 쪽)**의 상태로 구분합니다.

**습식 — 알람밸브**
· 1차·2차 모두 **가압수**, 폐쇄형 헤드
· 작동: 헤드 개방 → 2차측 압력 저하 → **클래퍼 개방** → 시트링 홀로 유입 → **압력스위치 → 경보·펌프 기동** (리타딩챔버: 오보 방지)
· 장점 구조 간단·즉시 방수 / 단점 **동결 우려**·오동작 시 수손

**건식 — 드라이밸브**
· 2차측 **압축공기·질소**, 폐쇄형 헤드
· 난방 없는 장소(주차장 등) 가능 / 단점: 방수 지연, 초기 화재 확대 우려

**준비작동식 — 프리액션밸브 + 솔레노이드밸브(전자밸브)**
· 2차측 **대기압(빈 배관)**, 폐쇄형 헤드, **감지기 A·B 교차회로**
· 작동: 감지기 **A·B 모두** 동작 → 솔레노이드 개방 → 프리액션밸브 개방 → 2차측 충수 → 헤드 개방 시 방수
· 수동: **SVP(슈퍼비조리판넬)** 스위치, 밸브의 수동기동밸브
· 장점 수손·동결 방지 / 단점 구조 복잡, 감지기 고장 시 미작동

**일제살수식 — 일제개방밸브(델류지)**
· **개방형 헤드**(감열체 없음) + 감지기 연동
· 구역 내 **전 헤드 동시 방수** — 무대부 등 급속 확산 장소 / 단점 대량 수손

정리: 2차측 — 습식 물 / 건식 공기 / 준비작동·일제 대기압. 개방형 헤드는 **일제살수식뿐**`},

{h:'스프링클러 ③ 점검 (시험밸브·작동시험·제어반)', body:`**습식 — 말단시험밸브 개방 시험**
· 가장 먼 가지배관 끝의 시험밸브 개방 = 헤드 1개 개방과 동일 상태
· 확인: ① 알람밸브 **압력스위치 → 경보** ② 수신기 **화재·밸브개방 표시등** ③ **펌프 자동 기동**
· 복구: 시험밸브 폐쇄 → 압력 복구 → 표시등·경보 복구 확인

**준비작동식 — 작동시키는 방법 4가지**
① 방호구역의 **감지기 A·B 회로 모두 작동** (교차회로 — 하나만으로는 미작동)
② **SVP 수동조작스위치** 작동
③ 프리액션밸브의 **수동기동밸브** 개방
④ 감시제어반에서 **동작(기동)시험**

**주의**: 2차측 개폐밸브를 **잠그고** 시험해야 수손 방지. 시험 후 배수 → 밸브 복구 → 제어반 **"자동" 위치** 확인

**제어반 확인 순서**: 감지기 A·B 표시등 → 솔레노이드 기동 → 프리액션밸브 개방 표시 → 펌프 기동 표시 순 점등 확인`},

{h:'가스계 소화설비 (CO₂ · 할론)', body:`**종류**: 이산화탄소 / **할론(1301 등)** / 할로겐화합물 및 불활성기체 소화설비
· 소화원리: **질식**(산소농도 저하) + 할론계는 **억제(부촉매)** 효과

**장점**
· 소화 후 **잔재·오염 없음** → 전산실·전기실·박물관에 적합
· **전기 절연성** — C급 적응 / 피연소물 손상 최소

**단점**
· 방출 시 **질식 위험** → 방출 전 음향경보 + 지연시간 확보
· 밀폐 필요, 고가 / **할론은 오존층 파괴로 생산 중단** (기존 설비만 유지)

**계통·작동**
· 저장용기 → 기동용기 → **선택밸브**(구역 선택) → 분사헤드 / 수동조작함
· 감지기 교차회로 또는 수동조작함 → 지연장치 → 방출
· **방출표시등**: 약제 방출 시 배관의 **압력스위치가 작동**하여 방호구역 **출입구 상부의 방출표시등 점등** ("소화약제 방출 중" — 입실 금지)`},

{h:'경보설비 ① 경계구역', body:`**경계구역**: 화재신호를 발신·수신·제어할 수 있는 구역

**설정 3원칙 + 예외** — 숫자 세트
① **2 이상의 건축물**에 미치지 않을 것
② **2 이상의 층**에 미치지 않을 것 → 예외: **2개 층 합계 500㎡ 이하**면 하나로 가능
③ 면적 **600㎡ 이하** + 한 변 **50m 이하**
   → 예외: 주된 출입구에서 **내부 전체가 보이면 1,000㎡ 이하** 가능 (한 변 50m는 유지)

**수직 경계구역**: 계단·경사로·엘리베이터 승강로 등은 **별도 경계구역**, 높이 **45m 이하**마다 구분, 지하층은 지상층과 별도(지하 1층뿐이면 예외)

암기: 500(2개층 예외) / 600(기본) / 1,000(다 보일 때) / 한 변 50m / 수직 45m`},

{h:'경보설비 ② 수신기·발신기·음향장치·시각경보기', body:`**수신기**
· 조작스위치 높이: **0.8 ~ 1.5m**
· 스위치·기능: 화재표시등, 지구표시등, 주경종·지구경종(정지스위치), **동작시험 · 회로도통시험 · 예비전원시험**, 자동복구, 복구
· 상시 사람이 근무하는 장소(경비실 등)에 설치

**발신기**: **층마다**, 수평거리 **25m 이하**, 스위치 높이 **0.8~1.5m**, 상부에 적색 위치표시등

**음향장치(경종)**: **층마다**, 수평거리 **25m 이하**, **1m 거리에서 90dB 이상**

**경보방식**
· 원칙: 전층 일제경보
· **11층 이상(공동주택 16층 이상)**: **발화층 + 직상 4개층** 우선경보
  — 1층 발화: + 지하 전체 / 지하 발화: 발화층 + 직상층 + 그 밖의 지하 전체

**시각경보장치**(청각장애인용): 복도·통로·객실 등, 높이 **2 ~ 2.5m** (천장 높이 2m 이하면 **천장에서 0.15m 이내**)`},

{h:'경보설비 ③ 감지기 — 종류·유효면적', body:`**열감지기**
· **차동식 스포트형**: 온도 **상승률**에 반응 — 거실·사무실 등 일반 장소
· **정온식 스포트형**: **일정 온도** 도달 시 작동 — **주방·보일러실** 등 평시 온도가 높은 곳

**연기감지기**
· **이온화식**: 연기가 이온전류를 감소시키는 것을 감지
· **광전식**: 연기 입자의 **빛 산란**을 감지 — 일반적으로 많이 사용
· 설치 장소: **계단·경사로, 복도(30m 이상), 엘리베이터 승강로**, 린넨슈트 + **공동주택 세대 내 거실**

**설치 유효면적** (부착높이 4m 미만 · 2종 기준, 1개당)
· **차동식 스포트 2종**: 내화구조 **70㎡** / 기타 **40㎡** (4~8m: 내화 35 / 기타 25)
· **연기감지기 2종**: 4m 미만 **150㎡** / 4~15m **75㎡**
· 연기감지기 수직: **계단 수직거리 15m마다**(3종 10m) / **복도 보행거리 30m마다**(3종 20m)

**축적형 감지기**: 연기가 **일정 시간 지속**될 때만 작동 → 일시적 연기에 의한 **비화재보(오작동) 방지**`},

{h:'경보설비 ④ 송배선식·수신기 시험 3가지', body:`**송배선식 배선**
· 배선을 **분기하지 않고** 감지기를 차례로 거쳐 끝에 **종단저항** 설치
· 목적: **회로 도통시험(단선 확인)이 가능**하도록 — 중간 분기 시 그 이후 단선을 확인 불가

**① 동작시험(화재작동시험)**
· 동작시험 + 자동복구 스위치 → 회로선택스위치를 각 회로로 회전
· 확인: 회로별 **화재표시등·지구표시등 점등, 음향장치 작동**

**② 회로도통시험**
· 도통시험 스위치 → 회로선택스위치 회전
· 확인: 전압계 지시(정상 **4~8V**) 또는 확인등(녹색 정상)으로 **단선 여부**
· 단선 시: 전압계 **0V** / 단선표시등 점등

**③ 예비전원시험**
· 예비전원시험 스위치 → 전압계·램프로 **정전 시 자동 절환**과 예비전원 상태 확인
· 정전 시 자동 절환, 복전 시 자동 복귀가 정상

시험 후 모든 스위치 **정위치 복구** + 스위치주의등 소등 확인`},

{h:'피난구조설비 ① 피난기구', body:`**종류와 특징**
· **미끄럼대**: 앉아 미끄러져 하강 — 노유자시설(장애인·노약자·어린이) 적합
· **피난사다리**: 고정식·올림식·내림식
· **구조대**: 포대 속으로 활강 — 경사강하식·수직강하식
· **완강기**: **몸무게로 하강속도 자동 조절**, 로프 릴 구조로 **교대 연속 사용 가능**
· **간이완강기**: 원리는 같으나 **1회용** — 숙박시설 객실(3층 이상 객실에 2개 이상)
· **공기안전매트**: 낙하 완충 — 공동주택
· 다수인피난장비, 승강식피난기, 하향식 피난구용 내림식사다리 등

**설치 제외 가능**: 피난층, 지상 1·2층(노유자시설 제외), 11층 이상 층 등

**적응성 예시**: 노유자시설 저층 — 미끄럼대·구조대 / 숙박시설 — 완강기·간이완강기`},

{h:'피난구조설비 ② 인명구조기구·비상조명등', body:`**인명구조기구** — 소화기는 포함되지 않음
· **방열복(방화복: 안전모·보호장갑·안전화 포함) · 공기호흡기 · 인공소생기**
· 설치: 지하역사·지하상가, 7층 이상 관광호텔, 5층 이상 병원 등

**비상조명등**
· 정전 시 **자동 점등**
· 조도: 각 부분 바닥에서 **1lx 이상**
· 비상전원: **20분 이상** → **60분 이상**: **지하상가·지하역사, 11층 이상의 층**, 도·소매시장 등
· 설치: 거실과 지상까지 통하는 복도·계단·통로

**휴대용 비상조명등**
· 대상: **숙박시설 객실마다 1개 이상**, **다중이용업소** 영업장 구획실마다 1개 이상, 대규모점포·영화상영관·지하역사·지하상가는 **보행거리 50m 이내마다 3개 이상**
· 설치 높이: **0.8 ~ 1.5m**
· 용량 **20분 이상**, 어둠 속 위치 확인 가능, 사용 시 **자동 점등**`},

{h:'피난구조설비 ③ 유도등·유도표지·3선식', body:`**종류**
· **피난구유도등**: 출입구 표시 — **녹색 바탕 + 백색** 그림·문자
· **통로유도등**: 방향 표시(백색 바탕 + 녹색) — **복도 · 거실 · 계단** 통로유도등
· **객석유도등**, 유도표지(축광식), 피난유도선

**설치 기준**
· **피난구유도등**: 피난구 상부, 바닥에서 **1.5m 이상**
· **복도통로유도등**: 구부러진 모퉁이 + **보행거리 20m마다**, 바닥에서 **1m 이하**
· 거실통로유도등: 보행거리 20m마다, **1.5m 이상**
· **계단통로유도등**: 경사로참·**계단참마다**, 1m 이하

**객석유도등** — 계산식 빈출
· 대상: **유흥주점**(춤추는 무대가 있는 카바레·나이트클럽 등), 문화·집회, 종교, 운동시설
· 개수 = **통로 직선부분 길이(m) ÷ 4 − 1** (소수점 **올림**)
  예: 직선 10m → 10/4−1 = 1.5 → **2개**

**3선식 배선 — 평상시 소등, 다음의 경우 자동 점등** (5가지)
① 자동화재탐지설비 **감지기·발신기 작동**

{h:'소방계획의 수립 ① 개념과 주요원리', body:`**소방계획**: 화재로 인한 피해를 예방·경감하기 위해 대상물의 위험요인을 분석하고 대응책을 문서화한 계획. 소방안전관리자가 **소방계획서를 작성·시행**하며, 소방본부장·소방서장은 작성·시행에 필요한 **지도·감독**을 할 수 있습니다.

**소방계획의 주요원리** — 3가지 세트 암기
· **종합적 안전관리**: 예방·대비·대응·복구 등 재난의 **전 단계**를 포괄하는 관리 (특정 단계만 다루지 않음)
· **통합적 안전관리**: 관계인·소방안전관리자·근무자 등 **내부**와 소방기관 등 **외부**의 협력, 그리고 **전원 참여**를 통한 거버넌스형 관리
· **지속적 발전모델**: **PDCA 사이클** — Plan(계획) → Do(이행) → Check(모니터링) → Act(개선)을 반복하며 계획을 계속 발전시킴

함정: "개별적 안전관리", "일회성 계획" 같은 보기는 원리에 어긋나는 오답입니다.`},

{h:'소방계획의 수립 ② 작성원칙 4가지', body:`**① 실현가능한 계획**일 것
· 이상적·완벽해 보이는 계획보다, 대상물의 실정에 맞아 **실제로 이행할 수 있는** 계획이어야 함

**② 관계인의 참여**
· 소방안전관리자 혼자 만드는 것이 아니라 관계인·근무자 등 **이해관계자가 참여**하도록 수립

**③ 계획수립의 구조화**
· **작성 → 검토 → 승인**의 3단계 구조화된 절차를 거쳐 수립

**④ 실행 우선**
· 문서 작성 자체보다 **계획의 실행이 우선** — 실행이 뒷받침되지 않는 계획은 의미가 없음

출제 유형: "작성원칙이 아닌 것은?" → "완벽하고 이상적인 계획 지향", "소방안전관리자 단독 작성", "문서 완성도 우선" 등이 오답 보기로 나옵니다.`},

{h:'소방계획의 수립 ③ 수립절차 4단계', body:`순서 자체가 시험에 나옵니다. **사전기획 → 위험환경 분석 → 설계 및 개발 → 시행 및 유지관리**

**1단계 — 사전기획** (작성 준비)
· 요구사항 검토, 작성 계획 수립, 관계자 의견 수렴

**2단계 — 위험환경 분석**
· 대상물 내 위험요인의 **식별 → 분석 → 평가**, 개선대책 검토

**3단계 — 설계 및 개발**
· 분석 결과를 바탕으로 소방계획의 **목표·전략 수립, 세부 실행계획(대응책) 설계**

**4단계 — 시행 및 유지관리**
· **검토·승인**을 거쳐 시행하고, 교육·훈련과 점검을 통해 **지속적으로 개선**(PDCA와 연결)

암기 팁: "기획하고(1) → 분석하고(2) → 설계하고(3) → 시행한다(4)" — 일반적인 업무 흐름 그대로입니다.`},

{h:'소방계획의 수립 ④ 소방계획서의 주요내용', body:`소방계획서에 포함해야 하는 주요 사항 (화재예방법 시행령 기준 발췌)

· 대상물의 **위치·구조·연면적·용도·수용인원** 등 **일반현황**
· 화재예방을 위한 **자체점검계획** 및 대응대책
· 소방시설·피난시설·방화시설의 **점검·정비 계획**
· **용도별** 방화구획, 피난시설·피난경로 현황과 **피난계획** (※ "규모별"이 아니라 **용도별** — 단어 바꿔치기 함정)
· **화기취급의 감독** 및 화재예방에 관한 사항
· 자위소방대 및 초기대응체계의 구성·운영·교육
· 소방훈련·교육에 관한 계획
· 위험물의 저장·취급에 관한 사항 등

**포함되지 않는 것(오답 보기 단골)**

{id:'q119',ch:'ch1',tag:'law',q:'화재예방강화지구 안의 소방대상물에 대한 화재안전조사 실시 주기는?',o:['연 1회 이상','연 2회 이상','2년에 1회 이상','분기 1회 이상'],a:0,e:'연 1회 이상 화재안전조사, 연 1회 이상 훈련·교육(10일 전 통지)입니다.'},
{id:'q120',ch:'ch1',tag:'law',q:'화재 예방조치로 옮긴 물건의 공고 기간과 보관기간으로 옳은 것은?',o:['공고 7일, 공고 종료 다음 날부터 14일','공고 14일, 공고 종료 다음 날부터 7일','공고 14일, 공고 종료 다음 날부터 14일','공고 30일, 공고 종료 다음 날부터 7일'],a:1,e:'14일 동안 인터넷 홈페이지 공고 후, 공고 종료일 다음 날부터 7일간 보관합니다.'},
{id:'q121',ch:'ch1',tag:'law',q:'화재예방안전진단 안전등급과 진단 주기의 연결로 옳은 것은?',o:['우수(A) — 4년','양호(B) — 6년','보통(C) — 5년','불량(E) — 6년'],a:2,e:'우수 6년 / 양호·보통 5년 / 미흡·불량 4년. 상태가 나쁠수록 자주 받습니다.'},
{id:'q122',ch:'ch1',tag:'law',q:'화재 또는 구조·구급이 필요한 상황을 거짓으로 알린 자에 대한 처분은?',o:['100만원 이하 과태료','200만원 이하 과태료','500만원 이하 과태료','1년 이하 징역'],a:2,e:'거짓 신고는 500만원 이하 과태료입니다(소방기본법).'},

{id:'q123',ch:'ch1',tag:'law',q:'특급 소방안전관리대상물의 기준으로 옳은 것은?',o:['30층 이상(지하층 제외)인 아파트','50층 이상(지하층 제외)이거나 지상 200m 이상인 아파트','지상 11층 이상인 특정소방대상물','연면적 1만5천㎡ 이상인 특정소방대상물'],a:1,e:'특급 아파트 기준은 50층 이상(지하 제외) 또는 200m 이상. ①은 1급 아파트, ③④는 1급 기준입니다.'},
{id:'q124',ch:'ch1',tag:'law',q:'소방안전관리 업무를 관리업자에게 대행하게 할 수 없는 대상물은?',o:['지상 11층 이상인 1급 대상물(연면적 1만5천㎡ 미만)','2급 소방안전관리대상물','3급 소방안전관리대상물','연면적 1만5천㎡ 이상인 1급 대상물'],a:3,e:'대행 가능: 11층 이상 1급(연면적 1만5천㎡ 미만·아파트 제외) + 2급 + 3급. 특급과 연면적 1만5천㎡ 이상 1급은 대행 불가.'},
{id:'q125',ch:'ch1',tag:'law',q:'소방안전관리 업무 중 대행이 가능한 업무로만 묶인 것은?',o:['소방계획서 작성, 자위소방대 운영','피난시설·방화구획·방화시설의 관리, 소방시설 등의 관리','소방훈련 및 교육, 피난계획 수립','화기취급의 감독, 초기대응'],a:1,e:'대행 가능 업무는 딱 2가지 — 피난시설·방화구획·방화시설의 관리와 소방시설 등의 관리입니다.'},
{id:'q126',ch:'ch1',tag:'law',q:'건설현장 소방안전관리대상물에 해당하지 않는 것은?',o:['신축 부분 연면적 합계 1만5천㎡ 이상','연면적 5천㎡ 이상으로서 지하 2개 층 이상','연면적 5천㎡ 이상으로서 지상 11층 이상','연면적 5천㎡ 이상으로서 지상 5층인 업무시설'],a:3,e:'5천㎡ 이상일 때는 지하 2개 층 / 지상 11층 / 냉동·냉장창고 중 하나여야 합니다.'},
{id:'q127',ch:'ch1',tag:'law',q:'소방안전관리자 실무교육에 대한 설명으로 옳은 것은?',o:['선임된 날부터 3개월 이내에 받아야 한다','선임된 날부터 6개월 이내에 받고, 이후 2년마다 받는다','선임된 날부터 1년 이내에 받고, 이후 3년마다 받는다','강습교육을 받았으면 실무교육은 영구히 면제된다'],a:1,e:'최초 6개월 이내, 이후 2년마다. 선임 전 1년 이내에 강습·실무교육을 받았다면 그것으로 최초 실무교육을 갈음합니다.'},
{id:'q128',ch:'ch1',tag:'law',q:'소방안전관리 업무수행 기록의 작성·보관 기준은?',o:['주 1회 작성, 1년 보관','월 1회 이상 작성, 2년 보관','분기 1회 작성, 2년 보관','월 1회 이상 작성, 3년 보관'],a:1,e:'월 1회 이상 작성·관리하고 작성일부터 2년간 보관합니다.'},
{id:'q129',ch:'ch1',tag:'law',q:'무창층 판단 시 개구부로 인정되는 요건이 아닌 것은?',o:['지름 50cm 이상의 원이 통과할 수 있을 것','바닥면으로부터 개구부 밑부분까지 1.2m 이내일 것','도로 또는 차량 진입이 가능한 빈터를 향할 것','내부에서 쉽게 부술 수 없는 견고한 구조일 것'],a:3,e:'쉽게 부수거나 열 수 있어야 개구부로 인정됩니다. "견고할 것"으로 바꿔 내는 함정입니다.'},
{id:'q130',ch:'ch1',tag:'law',q:'주택용 소방시설로 옳게 묶인 것은?',o:['소화기, 단독경보형감지기','소화기, 옥내소화전','스프링클러, 단독경보형감지기','소화기, 자동화재탐지설비'],a:0,e:'주택용 소방시설은 소화기와 단독경보형감지기 2가지입니다. 아파트·기숙사는 제외(별도 소방시설 대상).'},
{id:'q131',ch:'ch1',tag:'law',q:'방염 선처리물품의 방염성능검사 실시기관은?',o:['시·도지사','한국소방산업기술원','한국소방안전원','소방본부장'],a:1,e:'선처리물품은 한국소방산업기술원, 현장처리물품은 시·도지사가 실시합니다.'},
{id:'q132',ch:'ch1',tag:'law',q:'종합점검의 실시 시기로 옳은 것은?',o:['매년 1월 중','건축물 사용승인일이 속하는 달','소방안전관리자 선임일이 속하는 달','관계인이 원하는 달'],a:1,e:'종합점검은 사용승인일이 속하는 달에 실시하고, 작동점검은 그로부터 6개월이 되는 달에 실시합니다.'},
{id:'q133',ch:'ch1',tag:'law',q:'자체점검 결과의 제출·보고 기한으로 옳은 것은?',o:['관리업자→관계인 15일, 관계인→소방서장 10일','관리업자→관계인 10일, 관계인→소방서장 15일','관리업자→관계인 7일, 관계인→소방서장 30일','모두 30일 이내'],a:1,e:'관리업자는 점검 종료 후 10일 이내 관계인에게 제출, 관계인은 15일 이내 소방본부장·소방서장에게 보고합니다.'},
{id:'q134',ch:'ch1',tag:'law',q:'작동점검 제외 대상이 아닌 것은?',o:['소방안전관리자를 선임하지 않는 대상물','위험물제조소등','특급 소방안전관리대상물','2급 소방안전관리대상물'],a:3,e:'2급은 작동점검 대상입니다. 특급은 종합점검을 반기 1회 실시하므로 작동점검이 따로 없습니다.'},
{id:'q135',ch:'ch1',tag:'law',q:'건축법상 지하층의 기준으로 옳은 것은?',o:['바닥이 지표면 아래에 있으면 모두 지하층','바닥에서 지표면까지 평균높이가 층높이의 1/2 이상인 층','바닥에서 지표면까지 평균높이가 층높이의 1/3 이상인 층','창문이 없는 층'],a:1,e:'평균높이가 해당 층높이의 2분의 1 이상이어야 지하층입니다.'},
{id:'q136',ch:'ch1',tag:'law',q:'건축법상 주요구조부에 해당하지 않는 것은?',o:['내력벽','기둥','주계단','옥외계단'],a:3,e:'주요구조부: 내력벽·기둥·바닥·보·지붕틀·주계단. 사잇기둥·최하층 바닥·작은 보·차양·옥외계단은 제외.'},
{id:'q137',ch:'ch1',tag:'law',q:'건축물이 천재지변으로 멸실되어 그 대지에 종전 규모 이하로 다시 축조하는 것은?',o:['신축','개축','재축','이전'],a:2,e:'재해로 멸실 → 재축. 스스로 철거하고 다시 지으면 개축입니다.'},
{id:'q138',ch:'ch1',tag:'law',q:'용적률을 구하는 식으로 옳은 것은?',o:['건축면적 ÷ 대지면적 × 100','연면적 ÷ 대지면적 × 100','바닥면적 ÷ 건축면적 × 100','연면적 ÷ 건축면적 × 100'],a:1,e:'용적률 = 연면적/대지면적, 건폐율 = 건축면적/대지면적. 분자를 바꿔 출제합니다.'},
{id:'q139',ch:'ch1',tag:'law',q:'60분+ 방화문의 성능 기준으로 옳은 것은?',o:['연기·불꽃 60분 차단','연기·불꽃 60분 차단 + 열 30분 차단','연기·불꽃 30분 차단','열만 60분 차단'],a:1,e:'60분+는 연기·불꽃 60분 이상 차단에 열 30분 이상 차단이 추가된 것입니다.'},

/* ---------- 2. 소방학개론 ---------- */
{id:'q201',ch:'ch2',q:'연소의 3요소에 해당하지 않는 것은?',o:['가연물','산소공급원','점화원','이산화탄소'],a:3,e:'연소의 3요소는 가연물·산소공급원·점화원이며, 연쇄반응을 더하면 4요소입니다.'},
{id:'q202',ch:'ch2',q:'화재 분류에서 유류화재에 해당하는 것은?',o:['A급','B급','C급','D급'],a:1,e:'A 일반 / B 유류 / C 전기 / D 금속 / K 주방.'},
{id:'q203',ch:'ch2',q:'외부 점화원 없이 스스로 발화하는 최저온도는?',o:['인화점','연소점','발화점','비등점'],a:2,e:'발화점(착화점)은 점화원 없이 스스로 발화하는 온도, 인화점은 점화원이 있을 때 불이 붙는 최저온도입니다.'},
{id:'q204',ch:'ch2',q:'가연물을 없애서 불을 끄는 소화방법은?',o:['냉각소화','질식소화','제거소화','억제소화'],a:2,e:'제거소화. 가스밸브 차단, 산림화재 방화선 구축 등이 해당합니다.'},
{id:'q205',ch:'ch2',q:'화재 시 발생 가스 중 헤모글로빈과 결합해 산소 운반을 방해하는 것은?',o:['이산화탄소','일산화탄소','질소','수증기'],a:1,e:'일산화탄소(CO)는 헤모글로빈 친화력이 산소의 약 200배 이상으로 화재 사망의 주요 원인입니다.'},
{id:'q206',ch:'ch2',q:'열이 물질의 직접 접촉을 통해 전달되는 현상은?',o:['전도','대류','복사','비화'],a:0,e:'전도는 접촉, 대류는 유체의 흐름, 복사는 전자기파, 비화는 불티가 날아가 옮겨붙는 것입니다.'},
{id:'q207',ch:'ch2',q:'실내에 축적된 가연성 가스가 순간적으로 착화되어 화염이 실 전체로 확산되는 현상은?',o:['백드래프트','플래시오버','훈소','롤오버'],a:1,e:'플래시오버는 성장기에서 최성기로 넘어가는 순간적 전면 확산 현상입니다.'},
{id:'q208',ch:'ch2',q:'산소 부족 상태로 훈소하다가 산소가 유입되면서 폭발적으로 연소하는 현상은?',o:['플래시오버','백드래프트','슬롭오버','보일오버'],a:1,e:'백드래프트. 밀폐공간 문을 함부로 열면 발생하므로 개방 전 온도 확인이 필요합니다.'},
{id:'q209',ch:'ch2',q:'가연물의 조건으로 옳지 않은 것은?',o:['산소와 결합 시 발열량이 클 것','열전도율이 클 것','활성화 에너지가 작을 것','표면적이 넓을 것'],a:1,e:'열전도율이 작아야 열이 축적되어 잘 탑니다. "크다"로 나오면 오답입니다.'},
{id:'q210',ch:'ch2',q:'가연성 가스가 공기와 혼합되어 연소 가능한 농도 범위는?',o:['인화범위','연소(폭발)범위','발화범위','착화범위'],a:1,e:'연소범위(폭발범위). 하한계~상한계 사이에서만 연소·폭발합니다.'},

{id:'q211',ch:'ch2',q:'다음 중 인화점이 가장 낮은 물질은?',o:['디에틸에테르','등유','경유','에틸알코올'],a:0,e:'디에틸에테르 약 -45℃로 가장 낮은 편. 등유 30~60℃, 경유 50~70℃, 에틸알코올 13℃.'},
{id:'q212',ch:'ch2',q:'동일 물질에서 온도의 크기 순서로 옳은 것은?',o:['인화점 < 연소점 < 발화점','발화점 < 연소점 < 인화점','연소점 < 인화점 < 발화점','인화점 < 발화점 < 연소점'],a:0,e:'인화점 < 연소점(인화점보다 5~10℃ 높음) < 발화점. 예외 없는 순서입니다.'},
{id:'q213',ch:'ch2',q:'휘발유에 대한 설명으로 옳은 것은?',o:['인화점이 약 300℃로 높아 상온에서 안전하다','인화점 약 -43~-20℃, 발화점 약 300℃이다','인화점과 발화점이 모두 영하이다','발화점이 낮아 점화원 없이도 상온에서 발화한다'],a:1,e:'인화점이 낮다고 발화점도 낮은 것은 아닙니다. 휘발유는 인화점은 매우 낮지만 발화점은 약 300℃입니다.'},
{id:'q214',ch:'ch2',q:'연소범위가 가장 넓은 가스는?',o:['메탄','프로판','아세틸렌','부탄'],a:2,e:'아세틸렌 2.5~81%로 가장 넓습니다. 수소 4~75%가 그 다음. 메탄 5~15, 프로판 2.1~9.5.'},
{id:'q215',ch:'ch2',q:'가연물이 될 수 없는 물질과 그 이유의 연결이 옳은 것은?',o:['질소 — 산소와 반응 시 흡열반응을 하므로','이산화탄소 — 산소와 반응하지 않는 불활성 기체이므로','헬륨 — 이미 산화가 완결된 물질이므로','물 — 발열량이 너무 크므로'],a:0,e:'질소는 산소와 반응하지만 흡열반응이라 가연물이 아닙니다. CO₂·물은 완전산화물, 헬륨은 불활성 기체입니다.'},
{id:'q216',ch:'ch2',q:'주방에서 식용유로 인해 발생하는 화재의 분류는?',o:['A급','B급','D급','K급'],a:3,e:'식용유 화재는 K급. 재발화 위험 때문에 비누화 작용이 있는 K급 소화기를 사용합니다.'},
{id:'q217',ch:'ch2',q:'화재 분류와 표시색의 연결로 옳지 않은 것은?',o:['A급 일반화재 — 백색','B급 유류화재 — 황색','C급 전기화재 — 청색','D급 금속화재 — 적색'],a:3,e:'D급 금속화재는 무색입니다. 백·황·청·무로 암기합니다.'},
{id:'q218',ch:'ch2',q:'화재 시 인접 건물로 연소가 확대되는 주된 열전달 방식은?',o:['전도','대류','복사','접염'],a:2,e:'복사열은 매개체 없이 전자기파로 전달되어 인접 건물 연소 확대의 주원인입니다. 실내 상층부 확대는 대류.'},

{id:'q219',ch:'ch2',q:'연기의 이동속도가 가장 빠른 곳은?',o:['수평 방향 복도','수직 방향 벽면','계단실 등 수직공간','밀폐된 거실'],a:2,e:'수평 0.5~1m/s, 수직 2~3m/s, 계단실 3~5m/s. 계단으로 연기가 가장 빠르게 확산됩니다.'},
{id:'q220',ch:'ch2',q:'PVC 등 염소 성분 물질이 연소할 때 발생하는 맹독성 가스는?',o:['일산화탄소','포스겐','황화수소','이산화탄소'],a:1,e:'포스겐(COCl₂)은 염소 함유 물질의 연소·열분해 시 발생하는 맹독성 가스입니다.'},
{id:'q221',ch:'ch2',q:'실내 화재의 진행 단계를 순서대로 나열한 것은?',o:['초기→최성기→성장기→감쇠기','초기→성장기→최성기→감쇠기','성장기→초기→최성기→감쇠기','초기→성장기→감쇠기→최성기'],a:1,e:'초기(발화)→성장기→최성기→감쇠기 순입니다.'},
{id:'q222',ch:'ch2',q:'플래시오버가 발생하는 시점은?',o:['초기에서 성장기로 넘어갈 때','성장기에서 최성기로 넘어갈 때','최성기에서 감쇠기로 넘어갈 때','감쇠기 이후'],a:1,e:'플래시오버는 성장기→최성기 전환 시점에 발생하며, 이후에는 생존이 사실상 불가능합니다.'},
{id:'q223',ch:'ch2',q:'연소의 연쇄반응을 차단하는 소화방법은?',o:['제거소화','질식소화','냉각소화','억제소화'],a:3,e:'억제소화(부촉매소화)는 화학적 소화이며 할론·분말 약제가 해당합니다. 나머지 셋은 물리적 소화.'},
{id:'q224',ch:'ch2',q:'질식소화는 공기 중 산소 농도를 대략 몇 % 이하로 낮추는 것인가?',o:['21%','18%','15%','10%'],a:2,e:'산소 농도 15% 이하가 되면 연소가 지속되기 어렵습니다.'},

/* ---------- 3. 화기취급 감독 및 화재위험작업 ---------- */
{id:'q301',ch:'ch3',q:'용접·용단 작업 시 불티가 비산하는 거리는 통상 어느 정도로 보는가?',o:['약 1m','약 5m','약 11m','약 30m'],a:2,e:'용접 불티는 약 11m까지 비산하며, 작업 반경 11m 이내 가연물 제거 또는 방호가 원칙입니다.'},
{id:'q302',ch:'ch3',q:'화재위험작업 시 배치하는 화재감시자의 임무로 옳지 않은 것은?',o:['작업 중 화재 발생 여부 감시','소화기 등 초기소화 준비','작업 종료 후 최소 30분 이상 잔불 확인','작업자와 함께 용접 작업 수행'],a:3,e:'화재감시자는 감시 전담입니다. 작업에 참여하면 감시 기능을 상실합니다.'},
{id:'q303',ch:'ch3',tag:'law',q:'위험물을 지정수량 이상 저장·취급하려는 경우 필요한 절차는?',o:['신고만 하면 된다','시·도지사의 허가를 받아야 한다','별도 절차가 필요 없다','소방청장에게 등록한다'],a:1,e:'지정수량 이상은 제조소등 설치허가(시·도지사) 대상입니다.'},
{id:'q304',ch:'ch3',q:'위험물 제4류에 해당하는 것은?',o:['산화성 고체','가연성 고체','인화성 액체','자연발화성 물질'],a:2,e:'1류 산화성 고체 / 2류 가연성 고체 / 3류 자연발화성·금수성 / 4류 인화성 액체 / 5류 자기반응성 / 6류 산화성 액체.'},
{id:'q305',ch:'ch3',q:'LPG(액화석유가스) 누설경보기의 탐지부 설치 위치로 옳은 것은?',o:['천장면 하방 30cm 이내','바닥면 상방 30cm 이내','출입문 상단','환기구 옆'],a:1,e:'LPG는 공기보다 무거워 바닥에 깔리므로 바닥면 상방 30cm 이내. LNG(도시가스)는 가벼워 천장 하방 30cm 이내입니다.'},
{id:'q306',ch:'ch3',q:'전기화재의 주요 원인으로 보기 어려운 것은?',o:['단락(합선)','과부하','누전','접지'],a:3,e:'접지는 오히려 감전·전기화재를 예방하는 안전조치입니다.'},

{id:'q307',ch:'ch3',q:'화재위험작업 시 안전조치 5가지에 해당하지 않는 것은?',o:['작업 준비 및 작업 절차 수립','위험물 사용·보관 현황 파악','불티 비산방지덮개·용접방화포 설치','작업장 내 흡연구역 지정'],a:3,e:'5가지: 절차 수립, 위험물 현황 파악, 가연물 방호·소화기구 비치, 비산방지조치, 환기입니다.'},
{id:'q308',ch:'ch3',q:'화재감시자를 지정·배치하는 사람은?',o:['작업자 본인','화기작업 허가권자(소방안전관리자 등)','소방서장','건물 방문객'],a:1,e:'화기작업을 승인하는 화재안전 감독자(소방안전관리자 등)가 화재감시자를 지정·배치합니다.'},
{id:'q309',ch:'ch3',q:'화기취급작업 완료 후 화재감시자가 현장에 상주해야 하는 최소 시간은?',o:['10분','30분','1시간','3시간'],a:1,e:'작업 완료 후 30분 이상 상주하며 잔불을 확인하고, 종료 후 최소 3시간까지 순찰·점검합니다.'},
{id:'q310',ch:'ch3',q:'화기취급작업 종료 후 잔류 불티에 의한 발화 대비 순찰·점검 기준은?',o:['종료 즉시 1회만','종료 후 30분까지','종료 후 최소 3시간까지 일정 간격','다음 날 아침 1회'],a:2,e:'불티는 수 시간 후 발화할 수 있어 종료 후 최소 3시간까지 순찰·점검합니다.'},
{id:'q311',ch:'ch3',tag:'law',q:'휘발유의 지정수량은?',o:['100L','200L','400L','1,000L'],a:1,e:'휘발유 200L, 알코올류 400L, 등유·경유 1,000L, 중유 2,000L.'},
{id:'q312',ch:'ch3',tag:'law',q:'위험물과 지정수량의 연결이 옳지 않은 것은?',o:['등유 — 1,000L','중유 — 2,000L','황 — 100kg','질산 — 400kg'],a:3,e:'질산은 300kg입니다.'},
{id:'q313',ch:'ch3',q:'제1류 위험물의 성질은?',o:['산화성 고체','가연성 고체','인화성 액체','자기반응성 물질'],a:0,e:'1류 산화성 고체, 2류 가연성 고체, 3류 자연발화성·금수성, 4류 인화성 액체, 5류 자기반응성, 6류 산화성 액체.'},
{id:'q314',ch:'ch3',q:'제5류 위험물 화재의 소화방법으로 옳은 것은?',o:['이산화탄소로 질식소화','초기에 대량의 물로 냉각소화','마른모래로만 소화','소화가 필요 없다'],a:1,e:'5류는 분자 내 산소를 가져 질식소화가 무의미합니다. 초기 대량 주수로 냉각소화합니다.'},
{id:'q315',ch:'ch3',q:'전기화재의 원인 중 발생 빈도가 가장 높은 것은?',o:['단락(합선)','정전기','낙뢰','접지'],a:0,e:'단락(합선)이 전기화재 원인 중 가장 많습니다. 접지는 예방조치입니다.'},
{id:'q316',ch:'ch3',q:'LNG(도시가스)에 대한 설명으로 옳은 것은?',o:['주성분은 프로판이다','공기보다 무거워 바닥에 체류한다','경보기 탐지부는 천장면에서 하방 30cm 이내에 설치한다','경보기는 연소기로부터 4m 이내에 설치한다'],a:2,e:'LNG는 메탄이 주성분으로 공기보다 가벼워(비중 약 0.6) 천장 하방 30cm 이내, 연소기에서 8m 이내에 경보기를 설치합니다.'},

/* ---------- 4. 피난시설·방화구획 ---------- */
{id:'q401',ch:'ch4',tag:'law',q:'무창층에 대한 설명으로 옳은 것은?',o:['창문이 하나도 없는 층','개구부 면적의 합이 해당 층 바닥면적의 1/30 이하인 층','지하층을 말한다','개구부 면적이 바닥면적의 1/10 이상인 층'],a:1,e:'무창층은 요건을 갖춘 개구부 면적의 합계가 바닥면적의 1/30 이하인 지상층입니다.'},
{id:'q402',ch:'ch4',tag:'law',q:'피난시설·방화구획·방화시설 관련 금지행위가 아닌 것은?',o:['비상구를 폐쇄하거나 잠그는 행위','복도에 물건을 쌓아 통행을 방해하는 행위','방화문을 상시 개방 상태로 고정하는 행위','방화문을 항상 닫힌 상태로 유지하는 행위'],a:3,e:'방화문은 닫힌 상태 유지가 정상입니다(자동폐쇄장치가 있는 경우 화재 시 자동 폐쇄).'},
{id:'q403',ch:'ch4',q:'다음 중 방화문의 구분으로 옳지 않은 것은?',o:['60분+ 방화문','60분 방화문','30분 방화문','90분 방화문'],a:3,e:'방화문은 60분+ / 60분 / 30분 세 가지로 구분합니다.'},
{id:'q404',ch:'ch4',q:'화재 시 연기 확산을 막고 층·구역을 분리하기 위해 설치하는 것은?',o:['방화구획','채광창','방음벽','커튼월'],a:0,e:'방화구획은 면적별·층별·용도별로 구획하여 화재 확대를 억제합니다.'},
{id:'q405',ch:'ch4',q:'피난층에 대한 설명으로 옳은 것은?',o:['최상층을 말한다','곧바로 지상으로 갈 수 있는 출입구가 있는 층','지하 1층을 말한다','옥상층을 말한다'],a:1,e:'피난층은 직접 지상으로 통하는 출입구가 있는 층입니다.'},

{id:'q406',ch:'ch4',tag:'law',q:'10층 이하의 층에서 방화구획의 면적 기준은? (자동식 소화설비 미설치 시)',o:['바닥면적 500㎡ 이내마다','바닥면적 1,000㎡ 이내마다','바닥면적 3,000㎡ 이내마다','바닥면적 200㎡ 이내마다'],a:1,e:'10층 이하 1,000㎡(스프링클러 설치 시 3,000㎡), 11층 이상 200㎡(설치 시 600㎡)입니다.'},
{id:'q407',ch:'ch4',q:'환기 덕트가 방화구획을 관통하는 부분에 설치하는 것은?',o:['방화댐퍼','내화충전구조','방화셔터','릴리프밸브'],a:0,e:'덕트 관통부는 방화댐퍼, 배관·케이블 관통부 틈새는 내화충전구조로 처리합니다.'},
{id:'q408',ch:'ch4',tag:'law',q:'복도에 물건을 쌓아 피난에 지장을 준 자에 대한 처분은?',o:['100만원 이하 벌금','300만원 이하 과태료','500만원 이하 과태료','1년 이하 징역'],a:1,e:'피난시설·방화구획·방화시설 관련 금지행위는 300만원 이하 과태료(1차 100/2차 200/3차 300)입니다.'},

/* ---------- 5. 소방시설 ---------- */
{id:'q409',ch:'ch4',q:'다음 중 건축법상 피난시설에 해당하지 않는 것은?',o:['직통계단','복도','옥상광장','완강기'],a:3,e:'피난시설은 계단·복도·출입구(비상구)·옥상광장·피난안전구역 등 건축물의 시설입니다. 완강기·유도등은 소방시설(피난구조설비)입니다.'},
{id:'q410',ch:'ch4',q:'계단 진입 전 부속실(전실)을 거쳐 들어가도록 하여 연기 유입을 차단하는 계단은?',o:['직통계단','피난계단','특별피난계단','옥외계단'],a:2,e:'특별피난계단은 부속실을 경유하는 구조로 가장 안전합니다. 직통계단 < 피난계단 < 특별피난계단 순으로 안전 수준이 높아집니다.'},

{id:'q501',ch:'ch5',q:'소형소화기의 설치 기준(보행거리)으로 옳은 것은?',o:['각 층마다 보행거리 20m 이내','각 층마다 보행거리 30m 이내','각 층마다 보행거리 50m 이내','층수와 관계없이 1개'],a:0,e:'소형 20m 이내, 대형 30m 이내.'},

{id:'q503',ch:'ch5',q:'옥내소화전 노즐 선단의 방수압력 기준은?',o:['0.1MPa 이상 0.7MPa 이하','0.17MPa 이상 0.7MPa 이하','0.25MPa 이상 1.0MPa 이하','0.35MPa 이상 1.2MPa 이하'],a:1,e:'옥내 0.17~0.7MPa / 옥외 0.25~0.7MPa / 스프링클러 0.1~1.2MPa.'},
{id:'q504',ch:'ch5',q:'스프링클러설비의 종류에 해당하지 않는 것은?',o:['습식','건식','준비작동식','옥외식'],a:3,e:'습식·건식·준비작동식·부압식·일제살수식이 있습니다.'},

{id:'q506',ch:'ch5',q:'축압식 분말소화기 지시압력계에서 정상 범위를 나타내는 색은?',o:['적색','황색','녹색','백색'],a:2,e:'녹색이 정상. 좌측(황색)은 압력 부족, 우측(적색)은 과압입니다.'},
{id:'q507',ch:'ch5',q:'옥내소화전설비의 방수량 기준은?',o:['80L/min 이상','130L/min 이상','350L/min 이상','450L/min 이상'],a:1,e:'스프링클러 80 / 옥내 130 / 옥외 350 L/min.'},
{id:'q508',ch:'ch5',q:'다음 중 경보설비에 해당하지 않는 것은?',o:['자동화재탐지설비','비상방송설비','유도등','자동화재속보설비'],a:2,e:'유도등은 피난구조설비입니다.'},
{id:'q509',ch:'ch5',q:'주위 온도가 일정 온도 이상이 되면 작동하는 감지기는?',o:['차동식','정온식','광전식','이온화식'],a:1,e:'정온식은 일정 온도 도달 시, 차동식은 온도 상승률에 반응합니다.'},
{id:'q510',ch:'ch5',q:'화재를 발견한 사람이 수동으로 눌러 신호를 보내는 장치는?',o:['수신기','발신기','중계기','음향장치'],a:1,e:'발신기(수동), 수신기는 신호를 받아 표시·경보하는 장치입니다.'},
{id:'q511',ch:'ch5',q:'화재신호를 소방관서에 자동으로 통보하는 설비는?',o:['비상방송설비','자동화재속보설비','비상경보설비','누전경보기'],a:1,e:'자동화재속보설비는 자동화재탐지설비와 연동해 119로 자동 통보합니다.'},
{id:'q512',ch:'ch5',q:'다음 중 피난기구에 해당하지 않는 것은?',o:['완강기','구조대','피난사다리','유도등'],a:3,e:'유도등은 피난구조설비이지만 피난기구는 아닙니다.'},
{id:'q513',ch:'ch5',q:'몸무게에 따라 하강속도가 자동 조절되며 연속 사용이 가능한 피난기구는?',o:['간이완강기','완강기','피난교','공기안전매트'],a:1,e:'완강기는 교대로 연속 사용이 가능하고, 간이완강기는 1회용입니다.'},

{id:'q515',ch:'ch5',q:'상용전원 차단 시 자동 점등되어 피난을 돕는 조명설비는?',o:['유도등','비상조명등','객석유도등','통로유도표지'],a:1,e:'비상조명등은 정전 시 20분 이상(일정 조건에서 60분) 점등되어야 합니다.'},
{id:'q516',ch:'ch5',q:'다음 중 소화활동설비에 해당하는 것은?',o:['스프링클러설비','자동화재탐지설비','제연설비','유도등'],a:2,e:'소화활동설비: 제연·연결송수관·연결살수·비상콘센트·무선통신보조·연소방지설비.'},
{id:'q517',ch:'ch5',q:'소방차의 물을 건물 상층부로 보내기 위한 설비는?',o:['옥내소화전설비','연결송수관설비','스프링클러설비','옥외소화전설비'],a:1,e:'연결송수관설비. 송수구를 통해 소방차 물을 방수구까지 보냅니다.'},
{id:'q518',ch:'ch5',q:'소방대가 현장에서 조명·파괴장비 전원을 공급받는 설비는?',o:['비상콘센트설비','비상조명등','누전경보기','무선통신보조설비'],a:0,e:'비상콘센트설비는 지하층·11층 이상에서 소방대 전용 전원을 공급합니다.'},

{id:'q519',ch:'ch5',q:'대형소화기의 능력단위 기준으로 옳은 것은?',o:['A급 5단위 이상, B급 10단위 이상','A급 10단위 이상, B급 20단위 이상','A급 20단위 이상, B급 10단위 이상','A급·B급 모두 10단위 이상'],a:1,e:'대형소화기는 A급 10단위 이상, B급 20단위 이상이며 운반대·바퀴가 설치됩니다.'},
{id:'q520',ch:'ch5',q:'축압식 분말소화기 지시압력계의 정상 압력범위는?',o:['0.1~0.5MPa','0.7~0.98MPa','1.0~1.5MPa','0.17~0.7MPa'],a:1,e:'정상범위(녹색)는 0.7~0.98MPa입니다. 0.17~0.7은 옥내소화전 방수압력.'},
{id:'q521',ch:'ch5',q:'ABC급 분말소화기의 주성분과 약제 색상은?',o:['탄산수소나트륨 — 백색','제1인산암모늄 — 담홍색','탄산칼륨 — 회색','황산알루미늄 — 청색'],a:1,e:'ABC급(제3종)은 제1인산암모늄, 담홍색입니다. BC급은 탄산수소나트륨(백색).'},
{id:'q522',ch:'ch5',q:'소화기의 추가 배치 기준으로 옳은 것은?',o:['바닥면적 10㎡ 이상 거실마다','바닥면적 33㎡ 이상으로 구획된 거실마다','바닥면적 100㎡ 이상 거실마다','추가 배치 기준은 없다'],a:1,e:'보행거리 기준 외에 각 층 33㎡ 이상으로 구획된 거실(아파트는 세대)마다 추가 배치합니다.'},
{id:'q523',ch:'ch5',q:'소화기의 설치 높이 기준은?',o:['바닥으로부터 1.0m 이하','바닥으로부터 1.5m 이하','바닥으로부터 2.0m 이하','높이 제한 없음'],a:1,e:'바닥에서 1.5m 이하에 설치하고 "소화기" 표지를 부착합니다.'},

{id:'q525',ch:'ch5',q:'펌프의 체절운전 시 체절압력의 기준은?',o:['정격토출압력의 100% 이하','정격토출압력의 140% 이하','정격토출압력의 65% 이상','정격토출압력의 150% 이하'],a:1,e:'체절운전(유량 0)의 체절압력은 정격토출압력의 140% 이하여야 합니다.'},
{id:'q526',ch:'ch5',q:'순환배관에 설치하는 릴리프밸브의 개방압력 설정 기준은?',o:['체절압력 이상에서 개방','체절압력 미만에서 개방','정격압력의 65%에서 개방','항상 개방 상태 유지'],a:1,e:'릴리프밸브는 체절압력 미만에서 개방되도록 조정하여 체절운전 시 수온 상승·과압을 방지합니다.'},
{id:'q527',ch:'ch5',q:'기동용 수압개폐장치(압력챔버)의 용적 기준은?',o:['50L 이상','100L 이상','200L 이상','500L 이상'],a:1,e:'압력챔버의 용적은 100L 이상입니다.'},
{id:'q528',ch:'ch5',q:'압력챔버의 역할로 옳지 않은 것은?',o:['배관 내 압력 변동 감지','펌프의 자동 기동·정지','압력 변동의 완충(수격 방지)','소화수의 저장'],a:3,e:'압력챔버는 압력 감지·펌프 자동 기동정지·완충 역할을 하며 소화수 저장 기능은 없습니다.'},
{id:'q529',ch:'ch5',q:'옥내소화전 방수구의 설치 기준으로 옳은 것은?',o:['층마다, 수평거리 25m 이하, 바닥에서 1.5m 이하','2개 층마다, 수평거리 40m 이하','층마다, 수평거리 50m 이하, 높이 제한 없음','피난층에만 설치'],a:0,e:'층마다 설치, 각 부분에서 수평거리 25m 이하, 바닥에서 1.5m 이하 높이입니다.'},
{id:'q530',ch:'ch5',q:'옥내소화전함의 위치표시등에 대한 설명으로 옳은 것은?',o:['펌프가 기동될 때만 점등된다','평상시에도 상시 점등되어 있다','화재 시에만 점등된다','수동 스위치로만 점등된다'],a:1,e:'위치표시등은 소화전 위치를 알리기 위해 상시 점등입니다. 펌프기동표시등이 펌프 기동 시에만 점등됩니다.'},
{id:'q531',ch:'ch5',q:'옥내소화전 호스의 구경 기준은?',o:['25mm 이상','40mm 이상','65mm 이상','100mm 이상'],a:1,e:'옥내소화전 호스는 40mm 이상(호스릴은 25mm), 옥외소화전은 65mm입니다.'},
{id:'q532',ch:'ch5',q:'옥내소화전 방수압력 측정 방법으로 옳은 것은?',o:['분무형 관창으로 측정','직사형 관창을 사용하고 노즐 구경의 1/2 거리에서 피토게이지로 측정','노즐에서 5m 떨어져 육안으로 확인','호스 중간을 눌러 측정'],a:1,e:'직사형 관창 + 피토게이지, 노즐 선단에서 노즐구경의 1/2(D/2) 거리에서 방수류 중심을 측정합니다.'},
{id:'q533',ch:'ch5',q:'펌프성능시험 중 최대운전(과부하운전)의 판정 기준은?',o:['유량 0에서 정격압의 140% 이하','정격유량의 150%에서 정격토출압력의 65% 이상','정격유량의 100%에서 정격압 이상','정격유량의 65%에서 150% 압력'],a:1,e:'체절 0-140 / 정격 100-100 / 최대 150-65로 암기합니다.'},
{id:'q534',ch:'ch5',q:'일반 급수설비와 수조를 겸용할 때 옥내소화전의 유효수량은?',o:['수조 전체의 물','일반 급수펌프 풋밸브 위의 물 전부','일반 급수펌프 풋밸브 아래 ~ 소화용 펌프 풋밸브 위 사이의 물','소화용 펌프 풋밸브 아래의 물'],a:2,e:'일반 급수를 다 써도 소화용 물이 남도록, 두 흡수구 사이의 물만 유효수량으로 인정합니다.'},
{id:'q535',ch:'ch5',q:'옥외소화전설비의 방수압력 기준은?',o:['0.1~1.2MPa','0.17~0.7MPa','0.25~0.7MPa','0.35~1.0MPa'],a:2,e:'옥외 0.25~0.7MPa / 옥내 0.17~0.7 / 스프링클러 0.1~1.2.'},
{id:'q536',ch:'ch5',q:'옥외소화전의 설치 수평거리와 호스 구경은?',o:['25m 이하, 40mm','40m 이하, 65mm','50m 이하, 65mm','40m 이하, 40mm'],a:1,e:'옥외소화전은 수평거리 40m 이하, 호스 65mm입니다.'},
{id:'q537',ch:'ch5',q:'스프링클러헤드의 방수압력과 방수량 기준은?',o:['0.1~1.2MPa, 80L/min 이상','0.17~0.7MPa, 130L/min 이상','0.25~0.7MPa, 350L/min 이상','0.1~0.7MPa, 100L/min 이상'],a:0,e:'스프링클러는 0.1~1.2MPa, 80L/min 이상입니다.'},
{id:'q538',ch:'ch5',q:'습식 스프링클러설비의 작동 순서로 옳은 것은?',o:['압력스위치 작동→헤드 개방→클래퍼 개방','헤드 개방→2차측 압력 저하→클래퍼 개방→압력스위치 작동→경보·펌프 기동','펌프 기동→헤드 개방→경보','감지기 작동→헤드 개방→방수'],a:1,e:'습식은 헤드 개방이 시작점입니다. 감지기 작동으로 시작하는 것은 준비작동식·일제살수식입니다.'},
{id:'q539',ch:'ch5',q:'준비작동식 스프링클러설비의 구성으로 옳은 것은?',o:['알람밸브 + 리타딩챔버','드라이밸브 + 압축공기','프리액션밸브 + 솔레노이드밸브 + 감지기 교차회로','일제개방밸브 + 개방형 헤드'],a:2,e:'준비작동식은 프리액션밸브, 전자(솔레노이드)밸브, 감지기 A·B 교차회로로 구성되며 2차측은 대기압입니다.'},
{id:'q540',ch:'ch5',q:'건식 스프링클러설비의 2차측 배관 내부 상태는?',o:['가압수','압축공기 또는 질소','대기압의 빈 배관','진공'],a:1,e:'건식은 2차측에 압축공기·질소가 차 있어 동결 우려 장소에 사용합니다.'},
{id:'q541',ch:'ch5',q:'개방형 헤드를 사용하는 스프링클러 방식은?',o:['습식','건식','준비작동식','일제살수식'],a:3,e:'일제살수식만 감열체가 없는 개방형 헤드를 사용하여 구역 전체에 동시 방수합니다.'},
{id:'q542',ch:'ch5',q:'조기반응형 스프링클러헤드를 설치해야 하는 장소가 아닌 것은?',o:['공동주택의 거실','오피스텔의 침실','병원의 입원실','랙크식 창고'],a:3,e:'랙크식 창고는 라지드롭형 헤드 대상입니다. 조기반응형은 공동주택·노유자 거실, 숙박·오피스텔 침실, 병원 입원실.'},
{id:'q543',ch:'ch5',q:'스프링클러 가지배관 한쪽에 설치할 수 있는 헤드 수는?',o:['4개 이하','8개 이하','10개 이하','제한 없음'],a:1,e:'가지배관 한쪽의 헤드는 8개 이하입니다.'},
{id:'q544',ch:'ch5',q:'가스계 소화설비에서 방출표시등을 점등시키는 것은?',o:['감지기','압력스위치','솔레노이드밸브','수동조작함'],a:1,e:'약제 방출 시 배관의 압력스위치가 작동하여 출입구 상부의 방출표시등이 점등됩니다(입실 금지 표시).'},
{id:'q545',ch:'ch5',q:'자동화재탐지설비 경계구역의 기본 기준으로 옳은 것은?',o:['면적 1,000㎡ 이하, 한 변 100m 이하','면적 600㎡ 이하, 한 변 50m 이하','면적 500㎡ 이하, 한 변 30m 이하','면적 제한 없음'],a:1,e:'기본 600㎡·한 변 50m. 주 출입구에서 내부 전체가 보이면 1,000㎡까지 가능합니다.'},
{id:'q546',ch:'ch5',q:'하나의 경계구역이 2개 층에 걸칠 수 있는 경우는?',o:['어떤 경우에도 불가','2개 층 합계가 500㎡ 이하인 경우','2개 층 합계가 1,000㎡ 이하인 경우','관계인이 동의한 경우'],a:1,e:'2개 층 면적 합계 500㎡ 이하이면 하나의 경계구역으로 할 수 있습니다.'},
{id:'q547',ch:'ch5',q:'수신기 조작스위치의 설치 높이는?',o:['바닥에서 0.5~1.0m','바닥에서 0.8~1.5m','바닥에서 1.5~2.0m','바닥에서 2.0~2.5m'],a:1,e:'수신기·발신기 스위치 모두 바닥에서 0.8~1.5m입니다.'},
{id:'q548',ch:'ch5',q:'자동화재탐지설비 음향장치의 음량 기준은?',o:['1m 거리에서 60dB 이상','1m 거리에서 90dB 이상','10m 거리에서 90dB 이상','기준 없음'],a:1,e:'음향장치 중심에서 1m 떨어진 위치에서 90dB 이상이어야 합니다.'},
{id:'q549',ch:'ch5',q:'11층 이상 건축물에서 2층에 화재가 발생했을 때 우선 경보되는 층은?',o:['전 층 일제경보','발화층과 그 직상 4개 층','발화층만','최상층부터 순차'],a:1,e:'11층 이상(공동주택 16층 이상)은 발화층+직상 4개층 우선경보. 1층 발화 시 지하 전체 추가, 지하 발화 시 그 밖의 지하 전체 추가.'},
{id:'q550',ch:'ch5',q:'주방·보일러실처럼 평상시 온도가 높은 장소에 적합한 감지기는?',o:['차동식 스포트형','정온식 스포트형','광전식 연기감지기','이온화식 연기감지기'],a:1,e:'온도 변화가 큰 장소에서 차동식은 오작동하므로, 일정 온도에서 작동하는 정온식을 설치합니다.'},
{id:'q551',ch:'ch5',q:'계단·복도·엘리베이터 승강로에 설치하는 감지기는?',o:['차동식 열감지기','정온식 열감지기','연기감지기','불꽃감지기'],a:2,e:'수직·수평 통로에는 연기감지기(광전식 등)를 설치합니다. 계단은 수직거리 15m마다(2종).'},
{id:'q552',ch:'ch5',q:'감지기 회로를 송배선식으로 하는 이유는?',o:['공사비 절감','회로 도통시험(단선 확인)을 가능하게 하기 위해','감지기 감도 향상','미관상 이유'],a:1,e:'배선을 분기하지 않고 끝에 종단저항을 두어야 단선 여부를 도통시험으로 확인할 수 있습니다.'},
{id:'q553',ch:'ch5',q:'수신기 회로도통시험에서 단선일 때 나타나는 것은?',o:['전압계 4~8V 지시','전압계 0V 지시','화재표시등 점등','주경종 작동'],a:1,e:'정상은 4~8V, 단선은 0V(또는 단선표시등 점등)입니다.'},
{id:'q554',ch:'ch5',q:'객석유도등을 설치해야 하는 장소는?',o:['일반 사무실','유흥주점(카바레·나이트클럽 등)','아파트 세대 내','주차장'],a:1,e:'춤추는 무대가 있는 유흥주점, 문화·집회, 종교, 운동시설의 객석에 설치합니다.'},
{id:'q555',ch:'ch5',tag:'calc',q:'객석 통로의 직선부분 길이가 10m일 때 객석유도등의 최소 설치 개수는?',o:['1개','2개','3개','4개'],a:1,e:'개수 = 10 ÷ 4 − 1 = 1.5 → 소수점 올림 → 2개.'},
{id:'q556',ch:'ch5',q:'복도통로유도등의 설치 기준은?',o:['보행거리 20m마다, 바닥에서 1m 이하','보행거리 30m마다, 바닥에서 1.5m 이상','수평거리 25m마다, 높이 무관','계단참마다'],a:0,e:'구부러진 모퉁이와 보행거리 20m마다, 바닥에서 1m 이하에 설치합니다. 피난구유도등은 1.5m 이상.'},
{id:'q557',ch:'ch5',q:'피난구유도등의 설치 높이와 색상은?',o:['바닥에서 1m 이하, 백색 바탕','바닥에서 1.5m 이상, 녹색 바탕에 백색 문자','천장에 매립, 적색 바탕','높이 무관, 황색 바탕'],a:1,e:'피난구유도등은 피난구 상부 1.5m 이상, 녹색 바탕 + 백색 그림·문자입니다.'},
{id:'q558',ch:'ch5',q:'3선식 배선 유도등이 자동 점등되는 경우가 아닌 것은?',o:['감지기 또는 발신기가 작동될 때','상용전원이 정전될 때','방재실에서 수동으로 점등할 때','평상시 영업 중일 때'],a:3,e:'3선식은 평상시 소등(충전) 상태입니다. 감지기·발신기 작동, 비상경보 발신기 작동, 정전·단선, 수동 점등, 자동소화설비 작동 시 점등됩니다.'},
{id:'q559',ch:'ch5',q:'비상조명등의 조도 기준은?',o:['각 부분 바닥에서 0.5lx 이상','각 부분 바닥에서 1lx 이상','각 부분 바닥에서 10lx 이상','천장에서 5lx 이상'],a:1,e:'바닥에서 1lx 이상, 비상전원 20분 이상(지하상가·지하역사·11층 이상 층은 60분 이상)입니다.'},
{id:'q560',ch:'ch5',q:'휴대용 비상조명등에 대한 설명으로 옳지 않은 것은?',o:['숙박시설 객실마다 1개 이상 설치','설치 높이는 바닥에서 0.8~1.5m','건전지 용량은 20분 이상','사용 시 수동으로만 점등되면 된다'],a:3,e:'어둠 속에서 위치를 확인할 수 있고 사용 시 자동으로 점등되는 구조여야 합니다.'},

{id:'q561',ch:'ch5',q:'동력제어반의 기동스위치 표시등에 대한 설명으로 옳은 것은?',o:['평상시 적색 점등, 기동 시 소등','평상시 소등, 기동 시 적색 점등','평상시 녹색 점등, 기동 시 적색 점등','항상 소등 상태'],a:1,e:'기동스위치(표시등)는 평상시 소등, 펌프 기동 시 적색 점등. 정지스위치는 반대로 평상시 녹색 점등, 기동 시 소등입니다.'},
{id:'q562',ch:'ch5',q:'동력제어반의 정지스위치 표시등의 평상시 상태는?',o:['적색 점등','녹색 점등','소등','황색 점멸'],a:1,e:'정지스위치 표시등은 평상시 녹색 점등이며 펌프 기동 시 소등됩니다.'},
{id:'q563',ch:'ch5',q:'감시제어반·동력제어반의 절환(선택)스위치의 평상시 위치는?',o:['수동','정지','자동(연동)','전원 차단'],a:2,e:'평상시 자동(연동) 위치여야 화재 시 펌프가 자동 기동합니다. 수동 점검 후 자동 복구를 잊는 것이 가장 흔한 결함입니다.'},
{id:'q564',ch:'ch5',q:'펌프가 자동기동될 때 감시제어반에서 가장 먼저 확인되는 신호는?',o:['수조 저수위 표시등','압력스위치 동작(표시등 점등)','예비전원 감시등','도통시험 확인등'],a:1,e:'배관 내 압력 저하 → 압력챔버의 압력스위치 동작 → 감시제어반 압력스위치 표시등 점등 → 펌프 기동 순입니다.'},

/* ---------- 계산문제(수원량) ---------- */
{id:'q565',ch:'ch5',q:'소화기구의 3가지 구성에 해당하지 않는 것은?',o:['소화기','간이소화용구','자동확산소화기','옥내소화전설비'],a:3,e:'소화기구 = 소화기 + 간이소화용구 + 자동확산소화기. 옥내소화전은 별도 소화설비입니다.'},
{id:'q566',ch:'ch5',q:'자동소화장치(6종)에 해당하지 않는 것은?',o:['주거용 주방자동소화장치','상업용 주방자동소화장치','캐비닛형 자동소화장치','자동확산소화기'],a:3,e:'자동소화장치 6종: 주거용·상업용 주방, 캐비닛형, 가스, 분말, 고체에어로졸(주·상·캐·가·분·고). 자동확산소화기는 소화기구입니다.'},
{id:'q567',ch:'ch5',q:'물분무등소화설비(9가지)에 해당하지 않는 것은?',o:['미분무소화설비','강화액소화설비','스프링클러설비','고체에어로졸소화설비'],a:2,e:'물분무등 9가지: 물분무·미분무·포·이산화탄소·할론·할로겐화합물및불활성기체·분말·강화액·고체에어로졸. 옥내·옥외소화전과 스프링클러는 별도 설비입니다.'},
{id:'q568',ch:'ch5',q:'간이소화용구에 해당하지 않는 것은?',o:['에어로졸식 소화용구','투척용 소화용구','마른모래','ABC분말소화기'],a:3,e:'간이소화용구 4가지: 에어로졸식, 투척용, 소공간용, 소화약제 외의 것(마른모래·팽창질석·팽창진주암). 소화기는 별도입니다.'},
{id:'q569',ch:'ch5',q:'이산화탄소소화기에 대한 설명으로 옳지 않은 것은?',o:['자체 증기압으로 방사하므로 지시압력계가 없다','내용연수 규정이 없다','주된 소화효과는 질식이며 냉각효과도 일부 있다','지시압력계 정상범위는 0.7~0.98MPa이다'],a:3,e:'지시압력계는 축압식 분말소화기에 있는 것입니다. CO₂소화기는 지시압력계와 내용연수 규정이 없습니다.'},
{id:'q570',ch:'ch5',tag:'calc',q:'위락시설의 바닥면적이 600㎡일 때 필요한 소화기구의 최소 능력단위는? (내화·난연 조건 아님)',o:['10단위','20단위','30단위','6단위'],a:1,e:'위락시설은 30㎡마다 1단위. 600 ÷ 30 = 20단위.'},
{id:'q571',ch:'ch5',tag:'calc',q:'주요구조부가 내화구조이고 실내마감이 난연재료인 근린생활시설(바닥면적 1,000㎡)의 최소 능력단위는?',o:['10단위','5단위','20단위','2단위'],a:1,e:'근생 기준 100㎡ → 내화+난연이면 2배(200㎡) 적용. 1,000 ÷ 200 = 5단위.'},
{id:'q572',ch:'ch5',tag:'calc',q:'공동주택 바닥면적 800㎡(일반 구조)에 능력단위 A3 소화기를 배치할 때 최소 개수는?',o:['2개','3개','4개','8개'],a:1,e:'공동주택 100㎡당 1단위 → 8단위 필요. 8 ÷ 3 = 2.67 → 올림 3개.'},

/* =========================================================
   2. 저장소 (플랫폼 무관 · 실패해도 동작)
   ========================================================= */
const KEY='fsm2-study-v1';
const Store={
  async load(){
    try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return null;
  },
  async save(o){
    const s=JSON.stringify(o);
    try{ if(window.storage){ await window.storage.set(KEY,s); return; } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};

/* =========================================================
   3. 상태
   ========================================================= */
let S={ ans:{}, flag:{}, memo:{}, thEdit:{}, hl:{} };           // ans[qid]={p:선택,ok:정오}
let view={kind:'chapter',ch:'ch1',tab:'theory'};
let session=null;                     // 종합풀이 세션

const KEYS=['①','②','③','④','⑤'];
const byCh=id=>QS.filter(q=>q.ch===id);
const chOf=id=>CH.find(c=>c.id===id);
const wrongIds=()=>Object.keys(S.ans).filter(k=>S.ans[k] && !S.ans[k].ok && QS.some(q=>q.id===k));
const solved=id=>!!S.ans[id];

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* =========================================================
   4. 좌측 네비게이션
   ========================================================= */
function lampOf(chId){
  const qs=byCh(chId); if(!qs.length) return '';
  const done=qs.filter(q=>solved(q.id));
  const bad=done.filter(q=>!S.ans[q.id].ok);
  if(bad.length) return 'r';
  if(done.length===qs.length) return 'g';
  if(done.length) return 'a';
  return '';
}
function navItem(o){
  return '<button class="nav-item'+(o.on?' on':'')+'" data-go="'+o.go+'">'
    +(o.no?'<span class="no">'+o.no+'</span>':'')
    +'<span class="lamp '+(o.lamp||'')+'"></span>'
    +'<span class="nm">'+esc(o.name)+'</span>'
    +(o.ct!=null?'<span class="ct">'+o.ct+'</span>':'')
    +'</button>';
}
function renderNav(){
  const main=CH.filter(c=>!c.appendix), app=CH.filter(c=>c.appendix);
  let h='';
  h+='<div class="nav-group"><div class="label">검색</div>';
  h+=navItem({go:'search',name:'🔍 통합검색',lamp:'',on:view.kind==='search'});
  h+='</div>';
  h+='<div class="nav-group"><div class="label">주 과목</div>';
  main.forEach(c=>{
    h+=navItem({go:'ch:'+c.id,no:c.no,name:c.title,lamp:lampOf(c.id),ct:byCh(c.id).length||'',
      on:view.kind==='chapter'&&view.ch===c.id});
  });
  h+='</div>';

  h+='<div class="nav-group"><div class="label">유형별 모아보기</div>';
  h+=navItem({go:'calc',name:'계산문제',lamp:'',ct:QS.filter(q=>q.tag==='calc').length,on:view.kind==='calc'});
  h+=navItem({go:'law',name:'법령문제',lamp:'',ct:QS.filter(q=>q.tag==='law').length,on:view.kind==='law'});
  h+='</div>';

  h+='<div class="nav-group"><div class="label">실전</div>';
  h+=navItem({go:'final',name:'종합풀이',lamp:'',ct:QS.length,on:view.kind==='final'});
  h+=navItem({go:'wrong',name:'오답노트',lamp:wrongIds().length?'r':'',ct:wrongIds().length,on:view.kind==='wrong'});
  h+='</div>';

  h+='<div class="nav-group"><div class="label">부록</div>';
  app.forEach(c=>{
    h+=navItem({go:'ch:'+c.id,no:c.no,name:c.title,lamp:lampOf(c.id),ct:byCh(c.id).length||'',
      on:view.kind==='chapter'&&view.ch===c.id});
  });
  h+='</div>';

  h+='<div class="nav-group"><div class="label">관리</div>';
  h+=navItem({go:'data',name:'데이터 관리',lamp:'',on:view.kind==='data'});
  h+='</div>';

  document.getElementById('navBody').innerHTML=h;

  const total=QS.length, done=QS.filter(q=>solved(q.id)).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('meterFill').style.width=pct+'%';
  document.getElementById('meterL').textContent='진도 '+pct+'%';
  document.getElementById('meterR').textContent=done+' / '+total;
}

/* =========================================================
   5. 문제 카드
   ========================================================= */
function renderBody(key,raw){
  let h=esc(raw).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const hls=(S.hl&&S.hl[key])||[];
  hls.forEach(function(txt){
    const et=esc(txt);
    const pat=et.split('').map(function(ch){return ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('(?:<[^>]*>)*');
    try{
      h=h.replace(new RegExp(pat,'g'),function(m){
        return '<mark class="uhl" data-hl="'+encodeURIComponent(txt)+'" title="탭하면 형광펜을 지웁니다">'+m+'</mark>';
      });
    }catch(err){}
  });
  return h;
}
function thCard(chId,i){
  const base=THEORY[chId][i];
  const key=chId+'|'+base.h;
  const o=S.thEdit&&S.thEdit[key];
  const t=o||base;
  let h='<div class="card" id="th-'+chId+'-'+i+'">';
  h+='<h3><span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="th-t">'+esc(t.h)+'</span>';

function hl(text,q){
  const eT=esc(text), eQ=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return eT.replace(new RegExp(eQ,'gi'),function(m){return '<mark>'+m+'</mark>';}); }
  catch(e){ return eT; }
}
function snip(text,q){
  const t=String(text).replace(/\*\*/g,'').replace(/\n+/g,'  ');
  const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return '';
  const st=Math.max(0,i-28), en=Math.min(t.length,i+q.length+70);
  return (st>0?'… ':'')+hl(t.slice(st,en),q)+(en<t.length?' …':'');
}

  let h=head('SEARCH','통합검색','이론 · 문제 · 해설 · 내 메모를 한 번에 찾습니다',null);
  h+='<input class="search-in" id="searchIn" type="search" placeholder="예: 릴리프밸브, 300만원, 아세틸렌, 30일…" value="'+esc(view.q||'')+'" autocomplete="off">';
  h+='<div id="searchRes">'+searchRes(view.q||'')+'</div>';
  return h;
}
function searchRes(qraw){
  const q=(qraw||'').trim();
  if(q.length<2) return '<div class="empty"><strong>두 글자 이상 입력하세요</strong>키워드·숫자로 전체 자료를 검색합니다. (예: 140%, 압력챔버, 과태료)</div>';
  const lq=q.toLowerCase();
  let out='';
  let th='',tn=0;
  CH.forEach(function(c){
    (THEORY[c.id]||[]).forEach(function(t,i){
      if(tn>=40) return;
      const eff=(S.thEdit&&S.thEdit[c.id+'|'+t.h])||t;
      const plain=(eff.h+' '+eff.body.replace(/\*\*/g,'')).toLowerCase();
      if(plain.indexOf(lq)<0) return;
      tn++;
      th+='<button class="sres" data-jumpth="'+c.id+':'+i+'">'
        +'<span class="sr-t">'+hl(eff.h,q)+'</span>'
        +'<span class="sr-c">'+esc(c.title)+' · 이론 '+(i+1)+'</span>'
        +'<span class="sr-s">'+snip(eff.body,q)+'</span></button>';
    });
  });
  if(th) out+='<div class="sr-group"><div class="label">이론 ('+tn+')</div>'+th+'</div>';
  let qq='',qn=0;
  QS.forEach(function(x){
    if(qn>=40) return;
    const plain=(x.q+' '+x.o.join(' ')+' '+(x.e||'')).toLowerCase();
    if(plain.indexOf(lq)<0) return;
    qn++;
    const c=chOf(x.ch);
    let sn='';
    if((x.e||'').toLowerCase().indexOf(lq)>=0) sn=snip(x.e,q);
    else { const op=x.o.find(function(o){return o.toLowerCase().indexOf(lq)>=0;}); if(op) sn=hl(op,q); }
    qq+='<button class="sres" data-jumpq="'+x.id+'">'
      +'<span class="sr-t">'+hl(x.q,q)+'</span>'
      +'<span class="sr-c">'+esc(c?c.title:'')+' · '+x.id+(x.tag?' · '+x.tag:'')+'</span>'
      +(sn?'<span class="sr-s">'+sn+'</span>':'')+'</button>';
  });
  if(qq) out+='<div class="sr-group"><div class="label">문제 ('+qn+')</div>'+qq+'</div>';
  let mm='';
  Object.keys(S.memo||{}).forEach(function(k){
    const v=S.memo[k];
    if(!v||v.toLowerCase().indexOf(lq)<0) return;
    const parts=k.split('|'), ch=parts[0];
    const idx=(THEORY[ch]||[]).findIndex(function(t){return ch+'|'+t.h===k;});
    mm+='<button class="sres" data-jumpth="'+ch+':'+(idx<0?0:idx)+'">'
      +'<span class="sr-t">📝 '+esc(parts[1]||'메모')+'</span>'
      +'<span class="sr-s">'+snip(v,q)+'</span></button>';
  });
  if(mm) out+='<div class="sr-group"><div class="label">내 메모</div>'+mm+'</div>';
  if(!out) out='<div class="empty"><strong>검색 결과가 없습니다</strong>다른 키워드로 시도해 보세요.</div>';
  return out;
}

  var g='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="#666" stroke-width="1.5"/>';
  if(lit) g+='<circle cx="'+x+'" cy="'+y+'" r="'+(r+4)+'" fill="none" stroke="'+fill+'" stroke-width="2" opacity="0.5"/>';
  if(label) g+='<text x="'+x+'" y="'+(y-r-6)+'" font-size="11" text-anchor="middle" fill="#222" font-weight="700">'+label+'</text>';
  return g;
}
function _selector(x,y,pos){
  var g='<circle cx="'+x+'" cy="'+y+'" r="20" fill="#3a3a3a" stroke="#111" stroke-width="1.5"/>';
  g+='<text x="'+(x-30)+'" y="'+(y-20)+'" font-size="9" text-anchor="middle" fill="#222">수동</text>';

}
