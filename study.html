function qCard(q,idx){
  const a=S.ans[q.id];
  const cls=a?(a.ok?' ok':' no'):'';
  let h='<div class="qcard'+cls+'" id="card-'+q.id+'">';
  h+='<div class="qhead"><span class="qno">'+String(idx+1).padStart(2,'0')+'</span>';
  const c=chOf(q.ch); if(c) h+='<span class="qtag">'+esc(c.title.slice(0,12))+'</span>';
  if(q.tag==='calc') h+='<span class="qtag calc">계산</span>';
  if(q.tag==='law') h+='<span class="qtag law">법령</span>';
  if(a&&!a.ok) h+='<span class="qtag wrong">오답</span>';
  h+='<button class="qflag'+(S.flag[q.id]?' on':'')+'" data-flag="'+q.id+'">'+(S.flag[q.id]?'★ 표시됨':'☆ 표시')+'</button>';
  h+='</div><div class="qbody"><p class="qtext">'+esc(q.q)+'</p>';
  if(q.dg&&DIAGRAMS[q.dg]) h+='<div class="qdg">'+DIAGRAMS[q.dg]+'</div>';
  h+='<div class="opts">';
  q.o.forEach((op,i)=>{
    let oc='';
    if(a){ if(i===q.a) oc=' correct'; else if(i===a.p) oc=' picked-wrong'; }
    h+='<button class="opt'+oc+'" '+(a?'disabled':'')+' data-pick="'+q.id+'" data-i="'+i+'">'
      +'<span class="k">'+KEYS[i]+'</span><span>'+esc(op)+'</span></button>';
  });
  h+='</div>';
  if(a){
    h+='<div class="exp'+(a.ok?'':' no')+'"><span class="lb">'+(a.ok?'정답':'오답 · 정답 '+KEYS[q.a])+'</span>'+esc(q.e||'')+'</div>';
  }
  h+='</div></div>';
  return h;
}
function qList(list,emptyMsg){
  if(!list.length) return '<div class="empty"><strong>아직 문제가 없습니다</strong>'+esc(emptyMsg||'좌측 <데이터 관리>에서 문제를 추가하세요.')+'</div>';
  return autoChip()+list.map(qCard).join('');
}
function statBar(list,extra){
  const done=list.filter(q=>solved(q.id)).length;
  const ok=list.filter(q=>S.ans[q.id]&&S.ans[q.id].ok).length;
  const no=done-ok;
  let h='<div class="bar">';
  h+='<span class="stat">전체 <b>'+list.length+'</b></span>';
  h+='<span class="stat">푼 문제 <b>'+done+'</b></span>';
  h+='<span class="stat g">정답 <b>'+ok+'</b></span>';
  h+='<span class="stat r">오답 <b>'+no+'</b></span>';
  h+='<span class="sp"></span>'+(extra||'');
  h+='</div>';
  return h;
}

  }
  if(list.length){ h+='<h3 style="font-size:15px;margin:22px 0 10px">틀린 문제</h3>'+qList(list); }
  if(flagged.length){ h+='<h3 style="font-size:15px;margin:26px 0 10px">★ 표시한 문제</h3>'+qList(flagged); }
  return h;
}

function viewData(){
  let h=head('DATA','데이터 관리','이론과 문제를 JSON으로 붙여넣어 한 번에 추가합니다. 같은 id면 덮어씁니다.');
  h+='<div class="card"><h3>붙여넣기 형식</h3>'
   +'<pre class="schema">{\n'
   +'  <span class="s">"theory"</span>: {\n'
   +'    <span class="s">"ch1"</span>: [ { <span class="s">"h"</span>: "소방안전관리 제도", <span class="s">"body"</span>: "본문... **강조**는 형광펜" } ]\n'
   +'  },\n'
   +'  <span class="s">"questions"</span>: [\n'
   +'    { <span class="s">"id"</span>:"q999", <span class="s">"ch"</span>:"ch1", <span class="s">"tag"</span>:"law",\n'
   +'      <span class="s">"q"</span>:"문제 지문", <span class="s">"o"</span>:["보기1","보기2","보기3","보기4"],\n'
   +'      <span class="s">"a"</span>:2, <span class="s">"e"</span>:"해설" }\n'
   +'  ]\n}</pre>'
   +'<p class="hint">ch: ch1~ch5, ap1~ap4 · tag: "law"(법령) / "calc"(계산) / 생략 · a: 정답 인덱스(0부터)</p>'
   +'<textarea id="ta" placeholder=\'{"questions":[ ... ]}\'></textarea>'
   +'<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'
   +'<button class="btn" data-import="1">불러오기</button>'
   +'<button class="btn ghost" data-export="1">현재 데이터 내보내기</button>'
   +'</div></div>';
  h+='<div class="card"><h3>현재 등록 현황</h3><div class="theory"><div class="body">'
   +CH.map(c=>c.no+'. '+c.title+'  —  이론 '+((THEORY[c.id]||[]).length)+'개 · 문제 '+byCh(c.id).length+'개').join('\n')
   +'\n\n계산문제 '+QS.filter(q=>q.tag==='calc').length+'개 · 법령문제 '+QS.filter(q=>q.tag==='law').length+'개 · 총 '+QS.length+'문항'
   +'</div></div></div>';
  return h;
}

function render(){
  let h='';
  if(view.kind==='chapter') h=viewChapter();
  else if(view.kind==='calc') h=viewTagged('calc');
  else if(view.kind==='law') h=viewTagged('law');
  else if(view.kind==='final') h=viewFinal();
  else if(view.kind==='wrong') h=viewWrong();
  else if(view.kind==='data') h=viewData();
  else if(view.kind==='search') h=viewSearch();
  document.getElementById('view').innerHTML=h;
  document.getElementById('topTitle').textContent=
    view.kind==='chapter'?chOf(view.ch).title:
    ({calc:'계산문제',law:'법령문제',final:'종합풀이',wrong:'오답노트',data:'데이터 관리',search:'통합검색'})[view.kind];
  renderNav();
  window.scrollTo({top:0,behavior:'auto'});
}

/* =========================================================
   7. 이벤트
   ========================================================= */
function go(target){
  if(target.indexOf('ch:')===0){ view={kind:'chapter',ch:target.slice(3),tab:'theory'}; }
  else view={kind:target};
  closeNav(); render();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-go],[data-tab],[data-pick],[data-flag],[data-reset],[data-resettag],[data-start],[data-endsession],[data-retrywrong],[data-clearall],[data-import],[data-export],[data-jumpth],[data-jumpq],[data-memoedit],[data-memosave],[data-memocancel],[data-memodel],[data-thedit],[data-thsave],[data-thcancel],[data-threstore],[data-hladd],[data-autonext]');

  const mk=e.target.closest('mark.uhl');
  if(mk&&!t){
    const card=mk.closest('.card');
    if(card){
      const p=card.id.split('-'); const ch=p[1], idx=+p[2];
      const key=ch+'|'+THEORY[ch][idx].h;
      const txt=decodeURIComponent(mk.dataset.hl);
      if(S.hl&&S.hl[key]){
        S.hl[key]=S.hl[key].filter(function(x){return x!==txt;});
        if(!S.hl[key].length) delete S.hl[key];
        await Store.save(S);
        card.outerHTML=thCard(ch,idx);
        toast('형광펜을 지웠습니다');
      }
    }
    return;
  }
  if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.tab){ view.tab=t.dataset.tab; render(); return; }

  if(t.dataset.jumpth!==undefined){
    const p=t.dataset.jumpth.split(':');
    view={kind:'chapter',ch:p[0],tab:'theory'}; render();
    const el=document.getElementById('th-'+p[0]+'-'+p[1]);
    if(el){ if(el.scrollIntoView) el.scrollIntoView({block:'start'}); el.classList.add('hit'); setTimeout(function(){el.classList.remove('hit');},1800); }
    return;
  }
  if(t.dataset.jumpq!==undefined){
    const q=QS.find(function(x){return x.id===t.dataset.jumpq;}); if(!q) return;
    view={kind:'chapter',ch:q.ch,tab:'quiz'}; render();
    const el=document.getElementById('card-'+q.id);
    if(el){ if(el.scrollIntoView) el.scrollIntoView({block:'start'}); el.classList.add('hit'); setTimeout(function(){el.classList.remove('hit');},1800); }
    return;
  }
  if('memoedit' in t.dataset){
    const w=t.closest('.memoWrap'); if(!w) return;
    const k=decodeURIComponent(w.dataset.mk);
    const v=(S.memo&&S.memo[k])||'';
    w.innerHTML='<textarea class="memo-ta" rows="4" placeholder="이 섹션에 대한 나만의 메모를 적어두세요">'+esc(v)+'</textarea>'
      +'<div class="memo-acts"><button class="btn small" data-memosave>저장</button>'
      +'<button class="btn ghost small" data-memocancel>취소</button>'
      +(v?'<button class="btn ghost small danger" data-memodel>삭제</button>':'')+'</div>';
    const ta=w.querySelector('.memo-ta'); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
    return;
  }
  if('memosave' in t.dataset){
    const w=t.closest('.memoWrap'); const k=decodeURIComponent(w.dataset.mk);
    const v=w.querySelector('.memo-ta').value.trim();
    if(!S.memo) S.memo={};
    if(v) S.memo[k]=v; else delete S.memo[k];
    await Store.save(S);
    w.outerHTML=memoWrap(k);
    toast(v?'메모를 저장했습니다':'메모를 지웠습니다');
    return;
  }
  if('memocancel' in t.dataset){
    const w=t.closest('.memoWrap'); const k=decodeURIComponent(w.dataset.mk);
    w.outerHTML=memoWrap(k); return;
  }
  if('memodel' in t.dataset){
    const w=t.closest('.memoWrap'); const k=decodeURIComponent(w.dataset.mk);
    if(S.memo) delete S.memo[k];
    await Store.save(S);
    w.outerHTML=memoWrap(k);
    toast('메모를 지웠습니다'); return;
  }

  if(t.dataset.thedit){
    const p=t.dataset.thedit.split(':'); const ch=p[0], i=+p[1];
    const base=THEORY[ch][i], key=ch+'|'+base.h;
    const o=S.thEdit&&S.thEdit[key];
    const eff=o||base;
    const card=document.getElementById('th-'+ch+'-'+i);
    card.innerHTML='<div class="th-editform">'
      +'<input class="th-hin" value="'+esc(eff.h)+'" placeholder="섹션 제목">'
      +'<textarea class="th-bin" rows="16" placeholder="이론 내용">'+esc(eff.body)+'</textarea>'
      +'<p class="th-hint">**단어** 처럼 별표 두 개로 감싸면 굵은 강조로 표시됩니다. 수정본은 이 기기에만 저장되며 원본 파일은 바뀌지 않습니다.</p>'
      +'<div class="memo-acts">'
      +'<button class="btn small" data-thsave="'+ch+':'+i+'">저장</button>'
      +'<button class="btn ghost small" data-thcancel="'+ch+':'+i+'">취소</button>'
      +(o?'<button class="btn ghost small danger" data-threstore="'+ch+':'+i+'">원본 복원</button>':'')
      +'</div></div>';
    card.querySelector('.th-hin').focus();
    return;
  }
  if(t.dataset.thsave){
    const p=t.dataset.thsave.split(':'); const ch=p[0], i=+p[1];
    const base=THEORY[ch][i], key=ch+'|'+base.h;
    const card=document.getElementById('th-'+ch+'-'+i);
    const nh=card.querySelector('.th-hin').value.trim();
    const nb=card.querySelector('.th-bin').value;
    if(!nh||!nb.trim()){ toast('제목과 내용을 입력해 주세요'); return; }
    if(nh===base.h&&nb===base.body){ if(S.thEdit) delete S.thEdit[key]; }
    else { if(!S.thEdit) S.thEdit={}; S.thEdit[key]={h:nh,body:nb}; }
    await Store.save(S);
    card.outerHTML=thCard(ch,i);
    toast('이론을 수정했습니다');
    return;
  }
  if(t.dataset.thcancel){
    const p=t.dataset.thcancel.split(':');
    const card=document.getElementById('th-'+p[0]+'-'+p[1]);
    card.outerHTML=thCard(p[0],+p[1]);
    return;
  }
  if(t.dataset.threstore){
    const p=t.dataset.threstore.split(':'); const ch=p[0], i=+p[1];
    const key=ch+'|'+THEORY[ch][i].h;
    if(S.thEdit) delete S.thEdit[key];
    await Store.save(S);
    document.getElementById('th-'+ch+'-'+i).outerHTML=thCard(ch,i);
    toast('원본으로 복원했습니다');
    return;
  }
  if('hladd' in t.dataset){
    if(!pendHl) return;
    if(!S.hl) S.hl={};
    const arr=S.hl[pendHl.key]=S.hl[pendHl.key]||[];
    if(arr.indexOf(pendHl.text)<0) arr.push(pendHl.text);
    await Store.save(S);
    const card=document.getElementById('th-'+pendHl.ch+'-'+pendHl.i);
    if(card) card.outerHTML=thCard(pendHl.ch,pendHl.i);
    if(window.getSelection) window.getSelection().removeAllRanges();
    hideHlBar();
    toast('형광펜으로 표시했습니다');
    return;
  }

  if(t.dataset.pick){
    const q=QS.find(x=>x.id===t.dataset.pick); if(!q||S.ans[q.id]) return;
    const p=+t.dataset.i;
    const ok=(p===q.a);
    S.ans[q.id]={p:p,ok:ok};
    await Store.save(S);
    const card=document.getElementById('card-'+q.id);
    const idx=[...document.querySelectorAll('.qcard')].indexOf(card);
    card.outerHTML=qCard(q,idx<0?0:idx);
    renderNav();
    if(S.autoNext!==false){
      clearTimeout(autoT);
      autoT=setTimeout(function(){
        const cur=document.getElementById('card-'+q.id);
        if(!cur) return;
        let nxt=cur.nextElementSibling;
        while(nxt&&!(nxt.classList&&nxt.classList.contains('qcard')&&!nxt.classList.contains('ok')&&!nxt.classList.contains('no'))){
          nxt=nxt.nextElementSibling;
        }
        if(nxt&&nxt.scrollIntoView){
          nxt.scrollIntoView({behavior:'smooth',block:'start'});
          nxt.classList.add('hit');
          setTimeout(function(){nxt.classList.remove('hit');},1200);
        } else if(!nxt){
          const end=document.querySelector('.result');
          if(end&&end.scrollIntoView) end.scrollIntoView({behavior:'smooth',block:'start'});
        }
      }, ok?650:2400);
    }
    return;
  }
  if('autonext' in t.dataset){
    S.autoNext=(S.autoNext===false);
    await Store.save(S);
    t.classList.toggle('on',S.autoNext!==false);
    t.textContent=(S.autoNext!==false?'▶ 자동 이동 ON':'⏸ 자동 이동 OFF');
    toast(S.autoNext!==false?'정답 후 다음 문제로 자동 이동합니다':'자동 이동을 껐습니다');
    return;
  }
  if(t.dataset.flag){
    const id=t.dataset.flag; S.flag[id]=!S.flag[id]; await Store.save(S);
    t.classList.toggle('on'); t.textContent=S.flag[id]?'★ 표시됨':'☆ 표시';
    return;
  }
  if(t.dataset.reset){
    byCh(t.dataset.reset).forEach(q=>delete S.ans[q.id]);
    await Store.save(S); render(); toast('이 과목 기록을 지웠습니다');
    return;
  }
  if(t.dataset.resettag){
    QS.filter(q=>q.tag===t.dataset.resettag).forEach(q=>delete S.ans[q.id]);
    await Store.save(S); render(); toast('기록을 지웠습니다');
    return;
  }
  if(t.dataset.start){
    const n=Math.min(+t.dataset.start,QS.length);
    const ids=shuffle(QS.map(q=>q.id)).slice(0,n);
    ids.forEach(id=>delete S.ans[id]);
    session={ids:ids}; await Store.save(S); view={kind:'final'}; render();
    return;
  }
  if(t.dataset.endsession){ session=null; render(); return; }
  if(t.dataset.retrywrong){
    const ids=wrongIds(); ids.forEach(id=>delete S.ans[id]);
    await Store.save(S); render(); toast('오답 '+ids.length+'문항을 초기화했습니다');
    return;
  }
  if(t.dataset.clearall){
    if(!confirm('모든 풀이 기록과 표시를 지웁니다. 계속할까요?')) return;
    S={ans:{},flag:{},memo:(S.memo||{}),thEdit:(S.thEdit||{}),hl:(S.hl||{})}; session=null; await Store.save(S); render(); toast('전체 기록을 초기화했습니다 (메모·이론수정·형광펜은 유지)');
    return;
  }
  if(t.dataset.import){
    const ta=document.getElementById('ta');
    let data;
    try{ data=JSON.parse(ta.value); }
    catch(err){ toast('JSON 형식이 올바르지 않습니다: '+err.message); return; }
    let nq=0,nt=0;
    if(data.questions&&Array.isArray(data.questions)){
      data.questions.forEach(q=>{
        if(!q.id||!q.ch||!Array.isArray(q.o)) return;
        const i=QS.findIndex(x=>x.id===q.id);
        if(i>=0) QS[i]=q; else QS.push(q);
        nq++;
      });
    }
    if(data.theory&&typeof data.theory==='object'){
      Object.keys(data.theory).forEach(k=>{
        if(!Array.isArray(data.theory[k])) return;
        THEORY[k]=(THEORY[k]||[]).concat(data.theory[k]); nt+=data.theory[k].length;
      });
    }
    ta.value=''; render();
    toast('문제 '+nq+'개, 이론 '+nt+'개를 추가했습니다');
    return;
  }
  if(t.dataset.export){
    const out=JSON.stringify({theory:THEORY,questions:QS},null,2);
    const ta=document.getElementById('ta'); ta.value=out; ta.focus(); ta.select();
    toast('현재 데이터를 아래 칸에 내보냈습니다');
    return;
  }
});

/* 형광펜: 이론 본문 텍스트 선택 감지 */
let pendHl=null, selT=null, autoT=null;
function hideHlBar(){ const b=document.getElementById('hlBar'); if(b) b.style.display='none'; pendHl=null; }
function checkSel(){
  const bar=document.getElementById('hlBar');
  const sel=window.getSelection&&window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount){ hideHlBar(); return; }
  const txt=sel.toString().trim();
  if(txt.length<2||txt.length>200){ hideHlBar(); return; }
  let node=sel.anchorNode; if(node&&node.nodeType===3) node=node.parentElement;
  const body=node&&node.closest?node.closest('.theory .card .body'):null;
  if(!body){ hideHlBar(); return; }
  const card=body.closest('.card');
  const p=card.id.split('-'); const ch=p[1], i=+p[2];
  if(!THEORY[ch]||!THEORY[ch][i]) return;
  pendHl={key:ch+'|'+THEORY[ch][i].h, ch:ch, i:i, text:txt};
  const r=sel.getRangeAt(0).getBoundingClientRect();
  bar.style.display='flex';
  bar.style.top=Math.max(8,(window.scrollY||window.pageYOffset)+r.top-46)+'px';
  bar.style.left=Math.max(8,(window.scrollX||window.pageXOffset)+r.left+r.width/2-56)+'px';
}
document.addEventListener('selectionchange',function(){ clearTimeout(selT); selT=setTimeout(checkSel,300); });
(function(){
  const b=document.getElementById('hlBar');
  if(b) b.addEventListener('mousedown',function(e){ e.preventDefault(); });
  if(b) b.addEventListener('touchstart',function(e){ e.preventDefault(); e.target.click(); },{passive:false});
})();

/* 통합검색 입력 */
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='searchIn'){
    view.q=e.target.value;
    const r=document.getElementById('searchRes');
    if(r) r.innerHTML=searchRes(view.q);
  }
});

/* 모바일 드로어 */
function closeNav(){ document.getElementById('nav').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }
document.getElementById('navBtn').addEventListener('click',()=>{
  document.getElementById('nav').classList.toggle('on');
  document.getElementById('scrim').classList.toggle('on');
});
document.getElementById('scrim').addEventListener('click',closeNav);

/* 시작 */
(async function(){
  const saved=await Store.load();
  if(saved&&saved.ans) S=saved;
  if(!S.flag) S.flag={};
  if(!S.memo) S.memo={};
  if(!S.thEdit) S.thEdit={};
  if(!S.hl) S.hl={};
  render();
})();
</script>
